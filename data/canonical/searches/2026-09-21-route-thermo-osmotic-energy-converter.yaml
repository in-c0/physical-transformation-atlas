    - Semantic Scholar runs not made (anonymous API pool answered HTTP 429 throughout; key requested from the owner, exception e953) and the mandatory Google Scholar forms not run (one title lookup only, used to locate a readable copy of Xiao 2024); both are required for a negative
    - "OpenAlex driver-mechanism query: 203 works reported after the VPDO/PRMD aliases were added, the first 100 by relevance and the first 50 newest screened at title level (protocol depth), the rest unscreened; the first run without those aliases (198 reported) had missed every PRMD paper"
    - "citation chase on OpenAlex's reference lists and citing works only (Straub 2016: 47 of 48 references, 313 citers; Straub 2017: 56, 112; Luo 2024: 32, 7; Xiao 2024: 41 of 42, 5), screened at title level with a turbine / hydro / power-generation vocabulary filter; no full-text chase"
    - one plausible hit remains unread (Luo et al. 2024, Desalination 579:117485, paywalled) and could be a direct turbine run
    - the mechanism-pair, whole-chain and demonstration-precision queries returned 5, 1 and 0 works; the whole-chain hit is the 2017 theory paper
  conclusion: No physical experiment couples a turbine directly to a thermo-osmotic pressurised flow in the OpenAlex protocol runs or the four citation chases. The pressurised flow itself has been produced and its pressure × flux reported since 2014 (MemPower, Straub 2016, stack TOEC 2021, PRMD); the one hydro-turbine run (Xiao et al. 2024, a 2 W-rated bulb lit) stores the permeate in an elevated tank first and is recorded as longer-chain; the same driver and stage have been closed through electrokinetic and electrodialytic sinks instead (Huang 2021, Luo 2023, Ma 2025). Inconclusive until Luo 2024 is read and the Semantic Scholar and Google Scholar runs exist.
