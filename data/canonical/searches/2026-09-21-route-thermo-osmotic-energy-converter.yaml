      access: full-text
      decision: longer-chain
      reason: "Physical thermo-osmotic laboratory system (32 cm² permeate-gap module, hot feed to 70 °C, cold 20 °C): the pump-free membrane flow raises water into an elevated reservoir, storing gravitational potential energy, before the stored water descends through a small hydro-turbine generator and lights a 2 W-rated bulb (no output figure reported; head limited to about 1.5 m; liquid entry pressure 222 kPa). The gravitational storage and descent stage — the atlas's own hydro spelling, gravitational potential difference → hydrostatic descent → hydraulic pressure → lift — is an additional conversion between the target route's thermo-osmotic flow and turbine action (§3 item 6), so the exact composition is not demonstrated by it. Mechanical work was physically delivered (item 4 passes qualitatively). The 156.75 kW, 0.113 W m⁻², 1.04 % and 72-hour figures are the modelled solar case study. The lane notes its reservation: hydrostatically an open standpipe is a pressure accumulator, but the atlas records head conversion as a phenomenon and must apply that to itself."
