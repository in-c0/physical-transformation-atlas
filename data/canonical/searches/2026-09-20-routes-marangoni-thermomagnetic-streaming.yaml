      access: full-text
      decision: theory-only
      reason: Pini, Baier & Dietzel analyse the streaming potential of thermocapillary and destillocapillary free-surface flows analytically and numerically (arXiv 1609.09404 read in full); no experiment is reported. Recorded as the route's proposed pathway.
    - title: Electro-Marangoni Effect in Thin Liquid Films
      year: 2011
      doi: 10.1021/la1044656
      found_by:
        - search:2026-09-20-p-423a19acdd/oa-mp12
      access: abstract
      decision: wrong-coupling
      reason: Film drainage (not a temperature gradient) drives the liquid outflow that generates a streaming potential; the Marangoni effect is the reverse surface flow the potential produces. The chain runs drainage → streaming potential → electro-Marangoni, the opposite order to the route (abstract).
    - title: Thermocapillary convection during hydrogen evolution at microelectrodes
      year: 2019
      doi: 10.1016/j.electacta.2018.11.187
      found_by:
        - search:2026-09-20-p-423a19acdd/oa-dm1
      access: abstract
      decision: constituent-only
      reason: Ohmic heating at a Pt microelectrode sets up a temperature gradient whose thermocapillary stress drives electrolyte flow at hydrogen bubbles; velocity and temperature fields are measured (PTV, luminescence lifetime imaging). Temperature gradient → Marangoni flow is demonstrated; no streaming potential or current is measured (abstract).
    - title: Particle migration in suspensions by thermocapillary or electrophoretic motion
      year: 1990
      doi: 10.1017/s0022112090001884
      found_by:
        - search:2026-09-20-p-423a19acdd/oa-dm1
      access: abstract
      decision: wrong-coupling
      reason: Two mathematically analogous problems (thermocapillary bubble migration; electrophoresis of colloids) treated in parallel; thermocapillary flow does not generate the electrokinetic response (abstract).
    - title: "Heat transfer enhancement driven by thermo-electro-hydrodynamics (TEHD): Influence of the Marangoni effect"
      year: 2026
      doi: 10.1016/j.elstat.2026.104289
      found_by:
        - search:2026-09-20-p-423a19acdd/oa-dm1-newest
      access: metadata-only
      decision: wrong-coupling
      reason: "Title: an applied electric field drives the flow (electrohydrodynamics) with the Marangoni effect as a modifier; the electrical side is the driver, not an output. Not read beyond the title."
