# route-search-v1 query plan — p-a093d7ecc5
# Temperature gradient → Thermal expansion → Mechanical stress or strain → Flexoelectric effect → Separated surface charge → Electrical work
# D = Temperature gradient; M_1 = Thermal expansion; M_2 = Flexoelectric effect; O = Electrical work (k = 2).
# Written in loop-3 pass 24 (the reviewer's P1 candidate) from the recorded names and the aliases added first:
# thermal strain / thermoelastic strain / thermal expansion gradient on thermal expansion; flexoelectricity /
# flexoelectric / strain-gradient polarization / thermopolarization on the flexoelectric effect (the last is the
# name Iwakiri, Miyata & Mori 2026 give flexoelectric polarization under a temperature gradient). Google Scholar
# runs are performed by hand and recorded in the reviewed record, not here. Re-run in pass 27 with the field's own
# name for the composition — thermoflexoelectric effect / thermo-flexoelectric effect / thermoflexoelectricity (Wei
# et al. 2024) — added to the flexoelectric bundle after the second reader's pass-24 review. In pass 28 thermopolarization left
# the flexoelectric bundle for the atlas's new thermopolarization phenomenon; it stays a broad composition term here.
protocol_version: route-search-v1
route: p-a093d7ecc5
claims: [claim:thermal-expansion-drives, claim:thermal-expansion-produces-stress, claim:flexo-drives, claim:flexo-produces-charge, claim:surface-charge-converts-electricity]
driver_terms: [temperature gradient, temperature difference, thermal gradient, ΔT, waste heat]
phenomenon_terms:
  phenomenon:thermal-expansion: [thermal expansion, thermal strain, thermoelastic strain, thermal expansion gradient]
  phenomenon:flexoelectric-effect: [flexoelectric effect, flexoelectricity, flexoelectric, strain-gradient polarization, thermoflexoelectric effect, thermo-flexoelectric effect, thermoflexoelectricity]
output_terms: [electrical work, electricity, electrical output, DC power]
