# route-search-v1 query plan — p-8fba925ce8
# Temperature gradient → Thermo-osmosis → Fluid flow → Aerodynamic and hydrodynamic lift → Mechanical motion → Mechanical work
# D = Temperature gradient; M_1 = Thermo-osmosis; M_2 = Aerodynamic and hydrodynamic lift; O = Mechanical work (k = 2).
# The route carries the proposed pathway pathway:thermo-osmotic-energy-converter (Straub et al. 2016: the
# pressurised thermo-osmotic flow was measured, the turbine stage is proposed); the search asks whether anyone
# has closed the chain through a turbine. Written in loop-3 pass 21 from the recorded names and aliases, after
# adding the spelling variants thermoosmosis / thermo-osmotic / thermo-osmotic energy conversion to thermo-osmosis
# and hydraulic turbine / turbine to the lift phenomenon (its recorded aliases were rotor torque, blade lift and
# turbine action, none of which a paper on a membrane-pressurised flow would use). Google Scholar runs are
# performed by hand and recorded in the reviewed record, not here. Re-run after the second reader's screening
# added the field's own names for the same vapour-gap transport — vapor pressure-driven osmosis (VPDO) and
# pressure-retarded membrane distillation (PRMD) — as aliases of the phenomenon; the first run's query had
# missed every PRMD paper. Generic "membrane distillation" was rejected as too broad; "MemPower" names a device.
