# Temperature gradient → Thermoacoustic effect → Acoustic wave → Acoustoelectric effect → Charge carriers → Electrical work
# D = Temperature gradient; M_1 = Thermoacoustic effect; M_2 = Acoustoelectric effect; O = Electrical work (k = 2).
# Written in loop-3 pass 25 (the reviewer's P2 candidate) from the recorded names and the aliases added first:
