# effect / acoustoelectric voltage / acoustoelectric drag / Weinreich relation on the acoustoelectric effect. The
# atlas's acoustoelectric effect is Weinreich carrier drag (a travelling acoustic wave transfers momentum to mobile
# carriers), so piezoelectric "acoustoelectric" harvesters are wrong-coupling hits, not the composition. The
# reviewer's first query is recorded verbatim as the extra precision run oa-dp-r. Google Scholar runs are
# performed by hand and recorded in the reviewed record, not here.
