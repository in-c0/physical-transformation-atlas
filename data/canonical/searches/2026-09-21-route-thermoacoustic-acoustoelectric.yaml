  conclusion: "No demonstration known: the second reader's web search found no experiment in which a thermoacoustic engine, Rijke tube or Sondhauss tube drove classical Weinreich carrier drag, and each of its five nearest works fails the composition for a stated reason — the thermoacoustic-to-electric device that exists (Zheng 2022) is piezoelectric, and the acoustoelectric currents that exist (Weinreich 1959, Atashbar 2026) come from electrically launched waves. The physics review changed the route's spelling: Weinreich drag needs a travelling wave, so the candidate is now the travelling-wave spelling (handoff token acoustic:travelling-wave) and the generic-sound spelling is incomplete-handoff. Both conversion steps now carry a constitutive relation (Swift's critical gradient; the Weinreich relation), so the route is the atlas's first bounded candidate; the second reader's order-of-magnitude estimate — of order 10⁻³ of a 700 W engine's acoustic power crossing a bare helium–germanium interface, nanoamp-to-microamp acoustoelectric currents, femtowatt-to-sub-picowatt matched-load power — lives in the pass log, not here. Inconclusive as a route search until the engine runs exist. OpenAlex (pass 27) adds nothing that qualifies: the mechanism-pair form's single hit is the biomedical acoustoelectric effect, the whole-chain and precision forms return nothing, and the driver-mechanism list is thermoacoustic-engine engineering whose electrical converters are alternators, piezoelectric membranes (Smoker 2012 the earliest) or triboelectric generators — never Weinreich drag. Scholar and Semantic Scholar remain outstanding."
