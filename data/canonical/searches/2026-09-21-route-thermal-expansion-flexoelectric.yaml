  conclusion: "The exact composition has been observed but not converted: Iwakiri, Miyata & Mori 2026 impose a temperature gradient whose thermal expansion produces a strain gradient whose flexoelectric polarization is detected (voltage and displacement current) in eight centrosymmetric insulators, scaling with the expansion coefficient — every mechanism in order, no electrical work delivered. Nothing in the OpenAlex runs or the two chases puts a load on such a device; the thermal-flexoelectric literature otherwise concerns the converse effect, bending-imposed gradients, uniform-temperature conduction effects and flexo-induced pyroelectricity. Inconclusive as a route search until the Scholar and Semantic Scholar runs exist; the open question is now narrow: has anyone extracted work. After the second reader's review (pass 24) the composition is recorded as the observed pathway pathway:thermal-expansion-flexoelectric-response — status observed, observed_through the flexoelectric charge step, the final conversion to work unsupported — and the route reads observed · output not delivered while its class stays candidate. The reviewer's nearest additional hit, Han et al. 2026 (a heat-driven flexoelectric nanogenerator whose differential thermal deformation supplies the strain gradient; current response only in the accessible record), stays insufficient-information pending its full text. The composite-name form (pass 27) then surfaced what the decomposed forms could not: thermopolarization currents measured in dielectrics from 1982 (Kholkin, Trepakov & Smolenskii), in SrTiO₃, KTaO₃ and KH₂PO₄ by 1989 (Trepakov, Nurieva & Tagantsev, who separated a 'proper' non-flexoelectric thermopolarization from the flexoelectric 'tertiary pyroeffect'), and dynamically in relaxor paraelectrics by 1994 — polarization observed under a temperature gradient decades before the 2026 preprint, still with no load; whether the atlas needs a direct thermopolarization phenomenon beside the thermal-expansion → flexoelectric route is now the open scientific question."
