  hits:
    - title: Observation of universal thermopolarization effect in insulators
      year: 2026
      found_by:
        - search:2026-09-21-p-a093d7ecc5/cc-zubko-2013
      access: full-text
      decision: sink-variant
      reason: arXiv:2605.17224 (Iwakiri, Miyata & Mori, NIMS, 17 May 2026; not yet in OpenAlex, found through the reviewer and confirmed on arXiv), read in full. An on-chip heater driven at 1 kHz imposes a temperature gradient (about 0.5 K modulation) across 0.25–1 mm substrates; the non-uniform thermal expansion's strain gradient produces an out-of-plane flexoelectric polarization detected as a second-harmonic voltage and, more quantitatively, as the screening (displacement) current in a detector electrode, in MgO, Al₂O₃, MnO, mica, PET, PEN, polyimide and soda-lime glass; the response scales with the coefficient of thermal expansion, is reproduced by finite-element thermo-mechanics, grows as 1/thickness and by over an order of magnitude at the glass and antiferromagnetic transitions. Driver, both mechanisms and their order are physically present; the sink is a measured polarization and its displacement current, not electrical work delivered to a load, so the route's recorded output is not demonstrated.
    - title: Thermally Induced Flexo-Type Effects in Nanopatterned Multiferroic Layers
      year: 2020
      doi: 10.1002/adfm.201910371
      found_by:
