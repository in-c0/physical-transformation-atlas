        - search:2026-09-21-p-a093d7ecc5/cc-zubko-2013
      access: abstract
      decision: constituent-only
      reason: Thermal expansion in a nanopatterned array of ferromagnetic nanocylinders in a ferroelectric polymer produces giant strain gradients at moderate temperatures that depolarise the ferroelectric via the flexoelectric effect (and change the magnetisation flexomagnetically), with finite-element support — the thermal-expansion → strain-gradient → flexoelectric handoff observed, no electrical output (abstract read on OpenAlex).
