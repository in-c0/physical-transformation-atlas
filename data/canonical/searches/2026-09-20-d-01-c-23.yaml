      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9419229/
      external_ids: { openalex: W3042301273, pmc: PMC9419229, pubmed: "36132795" }
      found_by: [run:web-01, run:s2-01]
      access: full-text
      decision: route-only
      reason: "A physical experiment: an ion-track-etched polyimide membrane between hot and cold electrolyte reservoirs gave a steady streaming current rising linearly with ΔT to 14 nA at 47.5 °C. But the authors analyse it from the aspect of thermo-osmosis — ΔT drives thermo-osmotic liquid motion, the double layer makes that motion ion-selective, the moving counter-charge is the current, and its direction reverses with surface charge (pH). The temperature gradient reaches the family through a separately resolvable thermo-osmotic step, so this demonstrates the composition, not a direct Temperature gradient → Electrokinetic relation."
