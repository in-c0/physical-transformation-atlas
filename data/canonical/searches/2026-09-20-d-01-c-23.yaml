# The atlas's first reviewed search. Loop-3 pass 12 (20/09/2026) found a physical experiment; pass 13
# re-read its mechanism section ("investigated from the aspect of thermoosmosis", direction set by the
# surface charge) and reclassified it: the temperature gradient reaches the electrokinetic family
# through thermo-osmotic flow, a separately resolvable conversion, so the paper demonstrates a
# composition (recorded as claim:thermo-osmosis-couples-streaming), not a direct cell relation. Every
# DOI was resolved against Crossref and the paper's method read in its open-access full text.
