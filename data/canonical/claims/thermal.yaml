# --- Pyroelectric --------------------------------------------------------------
- id: claim:pyro-drives
  subject: disequilibrium:temperature-gradient
  predicate: drives
  object: phenomenon:pyroelectric-effect
  conditions:
    - the temperature of the polar crystal must change in time; a static gradient produces no current
    - the material must be below its Curie temperature
  condition_tags: [state-solid, medium-ferroelectric, transient-only]
  energy: { input: thermal, output: electrical, dissipation: thermal }
  relation:
    formula: "ΔP = p · ΔT"
    input: quantity:temperature-difference
    output: quantity:polarisation
    coefficient_unit: C/(m^2 K)
    coefficient_name: pyroelectric coefficient p
  evidence: [source:lang-2005, source:whatmore-1986, source:bowen-2014-pyro]
  status: established
  knowledge_level: K6
  notes: The driver is a temperature change rather than a gradient; the atlas records it under the temperature-gradient row because a fluctuating gradient is the practical source.
- id: claim:pyro-produces-charge
  subject: phenomenon:pyroelectric-effect
  predicate: produces
  object: carrier:surface-charge
  energy: { input: electrical, output: electrical }
  evidence: [source:lang-2005]
  status: established
- id: claim:pyro-member
