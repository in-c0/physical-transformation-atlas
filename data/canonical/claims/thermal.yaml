# Claims: thermal disequilibria and thermal effects.
# Shape: subject —predicate→ object, under conditions, with evidence and a status.
# Process claims (drives / produces / couples_to / converts_into) carry an energy ledger.

# --- Seebeck / thermoelectric ------------------------------------------------
- id: claim:seebeck-drives
  subject: disequilibrium:temperature-gradient
  predicate: drives
  object: phenomenon:seebeck-effect
  conditions:
    - a spatial temperature difference across a conductor or semiconductor
    - a closed circuit of dissimilar materials, or a single material with ends at different temperatures
  condition_tags: [state-solid, medium-conductor, temp-gradient-required]
  energy: { input: thermal, output: electrical, dissipation: thermal }
  relation:
    formula: "ΔV = S · ΔT"
    input: quantity:temperature-difference
    output: quantity:electric-potential
    coefficient_unit: V/K
    coefficient_name: Seebeck coefficient S
  evidence: [source:seebeck-1826, source:goldsmid-2016, source:callen-1948]
  status: established
  knowledge_level: K8
- id: claim:seebeck-produces-carriers
  subject: phenomenon:seebeck-effect
  predicate: produces
  object: carrier:charge-carriers
  conditions: [carriers diffuse from the hot end and accumulate at the cold end]
  energy: { input: electrical, output: electrical, dissipation: thermal }
  evidence: [source:goldsmid-2016, source:herring-1954]
  status: established
- id: claim:seebeck-member-thermoelectric
  subject: phenomenon:seebeck-effect
  predicate: member_of
  object: coupling:thermoelectric
  evidence: [source:goldsmid-2016]
  status: established
- id: claim:seebeck-bounded-carnot
