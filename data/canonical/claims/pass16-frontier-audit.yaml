# --- Marangoni self-propulsion: the surface-tension gradient moves the body itself -----------------
- id: claim:marangoni-produces-motion
  subject: phenomenon:marangoni-effect
  predicate: produces
  object: carrier:mechanical-motion
  conditions:
    - a floating or interface-bound body whose asymmetry (shape, or where it emits a surfactant or absorbs heat) leaves a net surface-tension force or torque on it
    - the body must be free to move on the interface; a rigid wall only sets up a flow
  condition_tags: [state-liquid]
  energy: { input: kinetic, output: mechanical, dissipation: thermal }
  evidence: [source:maggi-2015-thermocapillary-gears, source:frenkel-2019-marangoni-generator]
  handoff: { provides: [motion:relative-flux-change] }
  status: replicated
  knowledge_level: K5
  notes: "Two independent groups: thermocapillary microgears (Maggi et al. 2015, light-heated, up to 300 r.p.m.) and solutocapillary camphor rotors carrying magnets past a coil (Frenkel et al. 2019, 10–20 h). Distinct from Marangoni flow turning a rotor: here the Marangoni stress acts on the moving body directly."
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 16 (frontier candidates audited as physics; both sources read)" }
