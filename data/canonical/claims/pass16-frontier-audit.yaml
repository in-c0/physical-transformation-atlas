# --- Radiation pressure: the momentum-flux ceiling ------------------------------------------------
- id: claim:radiation-pressure-bounded-momentum-flux
  subject: phenomenon:radiation-pressure
  predicate: bounded_by
  object: constraint:radiation-momentum-flux
  conditions: [p = I/c for full absorption and at most 2I/c for perfect reflection at normal incidence; the mechanical power per unit area a surface moving at speed v can take is at most p·v]
  evidence: [source:landau-lifshitz-ecm, source:nichols-hull-1901]
  status: established
  notes: "The bound scopes the coupling by irradiance rather than declaring it impossible: in full sunlight it caps the mechanical power at ≈ 7 × 10⁻⁷ W m⁻² for a surface receding at 0.1 m s⁻¹, so a generator driven by radiation pressure is a micro-scale or high-irradiance proposition."
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 16 (frontier candidates audited as physics)" }
