  object: phenomenon:galvanic-reaction
  conditions: [a spontaneous redox couple split between two electrodes with an ion-conducting electrolyte between them]
  condition_tags: [env-aqueous]
  energy: { input: chemical, output: electrical, dissipation: thermal }
