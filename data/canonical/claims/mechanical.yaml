# --- Flexoelectric -----------------------------------------------------------------
- id: claim:flexo-drives
  subject: disequilibrium:mechanical-stress
  predicate: drives
  object: phenomenon:flexoelectric-effect
  conditions:
    - a strain gradient, e.g. bending; uniform strain produces nothing in a centrosymmetric dielectric
    - coefficients are small in bulk (nC/m) and useful only at the nanoscale or in thin films
  condition_tags: [state-solid, medium-dielectric]
  energy: { input: mechanical, output: electrical, dissipation: thermal }
  relation:
    formula: "P = μ · ∇ε"
    input: quantity:strain-gradient
    output: quantity:polarisation
    coefficient_unit: C/m
    coefficient_name: flexoelectric coefficient μ
  evidence: [source:zubko-2013]
  status: established
  knowledge_level: K4
- id: claim:flexo-produces-charge
  subject: phenomenon:flexoelectric-effect
  predicate: produces
  object: carrier:surface-charge
  energy: { input: electrical, output: electrical }
  evidence: [source:zubko-2013]
  status: established
- id: claim:flexo-member
  subject: phenomenon:flexoelectric-effect
  predicate: member_of
  object: coupling:flexoelectric
  evidence: [source:zubko-2013]
  status: established

