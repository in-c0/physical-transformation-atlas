# Claims: mechanical, fluid and gravitational disequilibria.

# --- Piezoelectric ------------------------------------------------------------
- id: claim:piezo-drives
  subject: disequilibrium:mechanical-stress
  predicate: drives
  object: phenomenon:piezoelectric-effect
  conditions:
    - a non-centrosymmetric crystal or a poled ferroelectric ceramic or polymer
    - stress below the depoling and fracture limits
  condition_tags: [state-solid, medium-non-centrosymmetric]
  energy: { input: mechanical, output: electrical, dissipation: thermal }
  relation:
    formula: "D = d · σ"
    input: quantity:stress
    output: quantity:surface-charge-density
    coefficient_unit: C/N
    coefficient_name: piezoelectric charge coefficient d
  evidence: [source:curie-1880, source:nye-1985, source:erturk-inman-2011]
  status: established
  knowledge_level: K8
- id: claim:piezo-produces-charge
