- id: claim:pv-implemented-tpv
  subject: phenomenon:photovoltaic-effect
  predicate: implemented_by
  object: transducer:thermophotovoltaic-cell
  conditions: [cell band gap matched to a > 2000 K emitter, with a back reflector returning sub-gap photons]
  evidence: [source:lapotin-2022]
