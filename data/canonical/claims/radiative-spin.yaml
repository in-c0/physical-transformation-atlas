# Pass 50 close: claim:photostriction-member (photostriction member_of coupling:photovoltaic, hypothesised on Spanier 2016) removed on the
# reviewer's finding — Spanier 2016 is a bulk-photovoltaic paper that classifies nothing, and photostriction is light-induced strain by
# several mechanisms (one of them photovoltaic charge separation followed by converse piezoelectric strain, a composition, not a family).
# The phenomenon and its drives / produces claims stay; a mechanism-specific spelling would be a claim sequence, never global taxonomy.
