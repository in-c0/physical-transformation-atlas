# Claims: radiative, spin and electromagnetic-wave conversions.

# --- Photovoltaic ------------------------------------------------------------------
- id: claim:pv-drives
  subject: disequilibrium:radiation-flux
  predicate: drives
  object: phenomenon:photovoltaic-effect
  conditions:
    - photon energy above the band gap of the absorber
    - a p–n junction or other asymmetry to separate the carriers before they recombine
  condition_tags: [state-solid, medium-semiconductor, illumination-required]
  energy: { input: radiative, output: electronic-excitation, dissipation: thermal }
  relation:
    formula: "J_sc = R · G"
    input: quantity:irradiance
    output: quantity:current-density
    coefficient_unit: A/W
    coefficient_name: spectral responsivity R
  evidence: [source:becquerel-1839, source:chapin-1954, source:shockley-queisser-1961]
  status: established
  knowledge_level: K8
- id: claim:pv-produces-pairs
  subject: phenomenon:photovoltaic-effect
  predicate: produces
  object: carrier:electron-hole-pairs
  energy: { input: electronic-excitation, output: electronic-excitation, dissipation: thermal }
  evidence: [source:shockley-queisser-1961]
  status: established
- id: claim:pairs-convert-electricity
  subject: carrier:electron-hole-pairs
  predicate: converts_into
  object: output:electricity
  conditions: [the junction field separates the pair and the carriers reach the contacts before recombining]
  condition_tags: [state-solid, medium-semiconductor]
  energy: { input: electronic-excitation, output: electrical, dissipation: thermal }
  evidence: [source:shockley-queisser-1961]
  status: established
- id: claim:pv-member
  subject: phenomenon:photovoltaic-effect
  predicate: member_of
  object: coupling:photovoltaic
  evidence: [source:shockley-queisser-1961]
  status: established
- id: claim:pv-bounded-sq
  subject: phenomenon:photovoltaic-effect
  predicate: bounded_by
  object: constraint:shockley-queisser-limit
  conditions: [single junction, unconcentrated sunlight]
  evidence: [source:shockley-queisser-1961]
  status: established
- id: claim:pv-bounded-landsberg
  subject: phenomenon:photovoltaic-effect
  predicate: bounded_by
  object: constraint:landsberg-limit
  evidence: [source:landsberg-tonge-1980]
  status: established
- id: claim:pv-implemented
  subject: phenomenon:photovoltaic-effect
  predicate: implemented_by
  object: transducer:photovoltaic-cell
  evidence: [source:chapin-1954, source:green-2024-tables]
  status: established
- id: claim:pv-observed-silicon
  subject: phenomenon:photovoltaic-effect
  predicate: observed_in
  object: material:silicon
  evidence: [source:chapin-1954]
  status: established
- id: claim:photons-drive-pv
  subject: carrier:photons
  predicate: drives
  object: phenomenon:photovoltaic-effect
  conditions: [photons from any source, including a thermal emitter, absorbed above the gap]
  condition_tags: [state-solid, medium-semiconductor]
  energy: { input: radiative, output: electronic-excitation, dissipation: thermal }
