- id: claim:bpv-drives
  subject: disequilibrium:radiation-flux
  predicate: drives
  object: phenomenon:bulk-photovoltaic-effect
  conditions: [a homogeneous non-centrosymmetric crystal under uniform illumination; no junction]
  condition_tags: [state-solid, medium-non-centrosymmetric, illumination-required]
