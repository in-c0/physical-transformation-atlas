# Loop-3 pass 46: the water-splitting limits of Fountaine, Lewerenz & Atwater on the photoelectrochemical effect — two ideal upper bounds
# scoped to water splitting by their basis, two realistic-case benchmarks (governed_by, like Curzon–Ahlborn: listed, never decisive).
# Pass 46 close: Cheng 2018 supports only its own architecture, measurements and pair-specific comparison (the reviewer's provenance
# guard), so it is evidence for none of these four generic records. Pass 47 close: Rozzi et al. 2020 (an open review, read) restates
# the two ideal limits, which are therefore established; the two realistic-case benchmarks rest on Fountaine alone and stay reported
# (the evidence model: established needs two independent groups or a review; the bound check reads the constraint, not the status).
- id: claim:pec-bounded-single-junction-ideal
  subject: phenomenon:photoelectrochemical-effect
  predicate: bounded_by
  object: constraint:pec-water-splitting-single-junction-ideal-limit
  conditions: ["photoelectrochemical water splitting with a single absorber; a datum states the basis 'PEC water splitting, single-junction absorber, AM1.5G'"]
