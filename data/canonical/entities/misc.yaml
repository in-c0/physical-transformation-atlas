  aliases: [TOEC, thermo-osmotic membrane engine]
  knowledge_level: K5
  summary: A hydrophobic nanoporous membrane passes a thermo-osmotic vapour flux from a hot reservoir into a pressurised cold reservoir; the pressurised flow is the mechanical output, proposed to drive a turbine.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 10 (frontier as a research instrument)" }
- id: transducer:bimetal-piezo-harvester
  type: transducer
  name: Bimetallic-strip piezoelectric harvester
  aliases: [bimetal heat engine with piezoelectric transducer, HEATec]
  knowledge_level: K6
  summary: A bimetallic strip snaps between a hot and a cold plate as it heats and cools; each snap strikes a piezoelectric element that converts the impact into charge.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 10 (frontier as a research instrument)" }
- id: transducer:thermomagnetic-pump
  type: transducer
  name: Thermomagnetic ferrofluid pump
  aliases: [automatic energy transport device, magnetocaloric pump]
  knowledge_level: K6
  summary: A ferrofluid loop with a permanent magnet at the heated section circulates by itself as the heated fluid loses magnetisation; a self-pumping heat-transport device with no moving parts.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 10 (frontier as a research instrument)" }
# Loop-3 pass 16: devices the frontier's candidate compositions turned out to be, and the momentum-flux bound on radiation pressure.
- id: transducer:thermocapillary-micromotor
  type: transducer
  name: Thermocapillary micromotor
  aliases: [light-driven microgear, Marangoni micromotor]
  knowledge_level: K5
  summary: A microfabricated asymmetric gear at a liquid–air interface spins when absorbed light heats it unevenly; the surface-tension gradient around its teeth drives a thermocapillary flow that torques the gear (Maggi et al. 2015, up to 300 r.p.m.).
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 16 (frontier candidates audited as physics; source read)" }
- id: transducer:marangoni-rotor-generator
  type: transducer
  name: Marangoni rotor mini-generator
  aliases: [camphor rotor generator, solutocapillary generator]
  knowledge_level: K5
