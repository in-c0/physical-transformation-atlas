  knowledge_level: K6
  summary: NiTi wires or springs cycled between warm and cold water (ΔT of 20–60 K) turning a crank or driving a linear generator; laboratory engines of watts to tens of watts.
- id: transducer:rotating-generator
  type: transducer
  name: Rotating electrical generator
  aliases: [alternator, synchronous generator, dynamo]
  knowledge_level: K8
