- id: constraint:radiation-momentum-flux
  type: constraint
  name: Radiation momentum flux
  bound: "p = I/c for full absorption, p ≤ 2I/c for perfect reflection at normal incidence; the mechanical power a moving surface can take from the pressure is at most p·v per unit area"
  constraint_kind: resource-bound
  metric: mechanical-power-density
  applies_to_sources: [disequilibrium:radiation-flux]
  summary: Radiation pressure is set by the momentum flux of the radiation, I/c to 2I/c. In full sunlight (I ≈ 1 kW m⁻²) that is at most ≈ 6.7 µPa; a surface moving at 0.1 m s⁻¹ against it receives at most ≈ 7 × 10⁻⁷ W m⁻², so mechanical work from radiation pressure is confined to high-irradiance or micro-scale regimes.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 16 (frontier candidates audited as physics)" }
