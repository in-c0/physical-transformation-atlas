# Carriers: what physically moves the energy between two phenomena.
- id: carrier:fluid-space-charge
  type: carrier
  name: Fluid-borne space charge
  aliases: [unipolar injected charge, charged species in a dielectric liquid]
  energy_form: electrical
  condition_tags: [state-liquid]
  summary: Net electrical charge transported with a dielectric liquid, as in liquid electrohydrodynamic generators; collected at an electrode it becomes electrical output.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 7 audit (ChatGPT review, applied and source-verified by the lane)" }
- id: carrier:charge-carriers
  type: carrier
  name: Charge carriers
  aliases: [electrons, holes, mobile electronic charge carriers]
  energy_form: electrical
  summary: "Mobile electronic charge carrying electrical energy. Their physical medium is specified by the producing/consuming claim; they may occur in a solid conductor or semiconductor, or in an ionised gas. Phase is not a property of this bookkeeping carrier."
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 26 (phase-neutral: the state-solid tag had manufactured a gas–solid interface on every MHD route)" }
- id: carrier:ionic-current
  type: carrier
  name: Ionic current
  aliases: [ion flux, electrolyte current]
  energy_form: electrical
  condition_tags: [state-liquid]
  summary: Charged ions moving through an electrolyte, membrane or channel.
- id: carrier:phonons
  type: carrier
  name: Phonons
  aliases: [lattice heat, heat current]
  energy_form: phonon
  condition_tags: [state-solid]
  summary: Quantised lattice vibrations carrying heat through a solid.
- id: carrier:heat-flow
  type: carrier
  name: Heat flow
  aliases: [conductive heat, convective heat]
  energy_form: thermal
  summary: Thermal energy moving down a temperature gradient by conduction or convection.
- id: carrier:photons
  type: carrier
  name: Photons
  aliases: [light, electromagnetic radiation]
  energy_form: radiative
  summary: Quanta of the electromagnetic field, from radio to gamma; sunlight and thermal emission are both photon fluxes.
- id: carrier:electron-hole-pairs
  type: carrier
  name: Electron–hole pairs
  aliases: [photoexcited carriers, excitons]
  energy_form: electronic-excitation
  condition_tags: [state-solid, medium-semiconductor]
  summary: Electrons promoted across a band gap and the holes they leave, before the junction separates them.
- id: carrier:magnons
  type: carrier
  name: Magnons
  aliases: [spin waves]
  energy_form: spin
  condition_tags: [state-solid, medium-ferromagnet]
  summary: Quantised spin waves carrying angular momentum through a magnetically ordered solid.
- id: carrier:spin-current
  type: carrier
  name: Spin current
  energy_form: spin
  condition_tags: [state-solid]
  summary: A flow of spin angular momentum, with or without net charge flow.
- id: carrier:acoustic-wave
  type: carrier
  name: Acoustic wave
  aliases: [sound, pressure oscillation]
  energy_form: acoustic
  summary: A propagating pressure oscillation in a gas, liquid or solid.
- id: carrier:mechanical-motion
  type: carrier
  name: Mechanical motion
  aliases: [shaft rotation, oscillating mass, moving plate]
  energy_form: mechanical
  summary: Bulk motion of a solid part — a rotor, a cantilever, a piston.
- id: carrier:elastic-stress
  type: carrier
  name: Elastic stress
  aliases: [strain, cyclic stress]
  energy_form: mechanical
  condition_tags: [state-solid]
  summary: Stress and strain stored in a deformed solid, the form in which vibration reaches a piezoelectric or magnetoelastic element.
- id: carrier:fluid-flow
  type: carrier
  name: Fluid flow
  aliases: [moving liquid or gas, jet, stream]
  energy_form: kinetic
  condition_tags: [flow-required]
  summary: Bulk motion of a liquid or gas carrying kinetic energy and pressure.
- id: carrier:magnetic-flux
  type: carrier
  name: Changing magnetic flux
  energy_form: magnetic
  summary: Magnetic flux that varies through a circuit and can therefore induce an EMF.
- id: carrier:electromagnetic-wave
  type: carrier
  name: Electromagnetic wave
  aliases: [radio waves, microwaves, RF]
  energy_form: radiative
  summary: Propagating electromagnetic field at radio or microwave frequency.
- id: carrier:hot-gas
  type: carrier
  name: Hot gas
  aliases: [combustion products, hot working gas, steam, working fluid, hot pressurised gas]
  energy_form: thermal
  condition_tags: [state-gas, temp-high]
  summary: "A gas or vapour carrying thermal energy at elevated temperature, the intermediate of every combustion or nuclear heat engine. Pressure or an available expansion ratio is not implied by this carrier and must be established separately when a downstream conversion requires it: combustion heats the gas, a compressor or a boiler's feed pump pressurises it, and thermal emission or an MHD channel can consume hot gas without an expansion ratio."
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 36 (renamed from 'Hot pressurised gas': claim:combustion-produces-hot-gas establishes heating, not compression — the second reader's finding)" }
- id: carrier:beta-particles
  type: carrier
  name: Beta particles
  aliases: [energetic electrons from beta decay]
  energy_form: nuclear
  summary: Electrons (or positrons) emitted by beta decay with keV–MeV kinetic energy; ranges of millimetres in solids.
- id: carrier:water-vapour
  type: carrier
  name: Water vapour
  energy_form: chemical
  condition_tags: [state-gas]
  summary: Evaporated water carrying latent heat away and sustaining the capillary flow behind it.
- id: carrier:hydraulic-pressure
  type: carrier
  name: Hydraulic pressure
  energy_form: mechanical
  condition_tags: [state-liquid]
  summary: Pressurised liquid volume that can be expanded through a turbine or piston.
- id: carrier:surface-charge
  type: carrier
  name: Separated surface charge
  energy_form: electrical
  summary: Charge left on a surface by contact, temperature change or stress, which relaxes through an external circuit.
- id: carrier:proton-gradient
  type: carrier
  name: Transmembrane proton gradient
  energy_form: osmotic
  condition_tags: [env-aqueous, medium-membrane]
  summary: A proton concentration and potential difference across a biological membrane.
- id: carrier:reduced-carbon
  type: carrier
  name: Reduced carbon compounds
  aliases: [biomass, sugars]
  energy_form: chemical
  summary: Chemical energy stored in carbohydrate bonds by photosynthesis.
- id: carrier:alpha-particles
  type: carrier
  name: Alpha particles
  energy_form: nuclear
  summary: Helium nuclei emitted by alpha decay with a few MeV each; stopped within tens of micrometres in a solid.
- id: carrier:chemical-fuel
  type: carrier
  name: Chemical fuel (H₂, CO, syngas)
  aliases: [hydrogen, carbon monoxide, syngas, stored chemical free energy]
  energy_form: chemical
  summary: Reduced chemical products carrying free energy for later oxidation.
