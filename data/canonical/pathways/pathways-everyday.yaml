- id: pathway:reverse-electrowetting-harvester
  name: Reverse-electrowetting harvester
  steps: [claim:rew-drives, claim:rew-produces, claim:charge-carriers-convert-electricity]
  evidence: [source:krupenkin-taylor-2011]
  status: demonstrated
  knowledge_level: K4
  performance:
    measurements:
      # pass 37: the mixed legacy field split — the measured level recorded, the projection kept only in the audit (Krupenkin & Taylor 2011 read on the open page)
      - quantity: instantaneous electrical power density
        value: "≈ 10² W/m²"
        value_numeric: 100
        unit: W/m²
        metric: power-density
        normalization: { kind: area, basis: liquid-substrate-overlap-area }
        basis: "instantaneous resistive-load electrical power divided by the instantaneous / maximum liquid–substrate overlap area as the experiment defines it — an active-interface density, not a device-footprint one"
        scope: device
        conditions: "arrays of droplets oscillated against nanometre-thick multilayer dielectric films at tens of hertz; three configurations (28 mm² and 8 mm² liquid–substrate overlap per droplet) gave the same level"
