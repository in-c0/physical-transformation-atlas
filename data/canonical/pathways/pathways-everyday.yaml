        year: 2011
        note: "the abstract's 'high power densities, up to 10³ W m⁻²' is the authors' stated potential of the method, with no assumptions or denominator in the text read, so it is not recorded; the '≈ 1 mW per droplet-electrode' the atlas carried until pass 37 appears nowhere in the paper"
  environment: [state-liquid, field-electric-required]
  summary: Droplets forced across biased dielectric-coated electrodes pump charge through the load.

