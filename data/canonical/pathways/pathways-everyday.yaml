  status: commercial
  knowledge_level: K8
  performance:
    notes: "effectiveness 0.6–0.95 for counterflow designs; no thermodynamic ceiling on heat delivered, only on its temperature"
  environment: [temp-gradient-required]
  summary: Heat conducts through a wall from the hot stream to the cold one.

- id: pathway:passive-radiative-cooler
  name: Passive daytime radiative cooler
  steps: [claim:sky-drives-radiative-cooling, claim:radiative-cooling-converts-cooling]
  evidence: [source:raman-2014]
  status: demonstrated
  knowledge_level: K7
  performance:
    theoretical_limit: "site- and atmosphere-dependent; of order 100–150 W/m² near ambient under favourable clear, dry conditions — not a universal constant"
    measurements:
      # pass 37: the legacy power_density migrated — Raman et al. 2014's abstract read on the Nature page
      - quantity: radiative cooling power density at ambient air temperature
        value: "40.1 W/m²"
        value_numeric: 40.1
        unit: W/m²
        metric: power-density
        normalization: { kind: area, basis: radiative-cooler-area }
        basis: "net cooling power per unit area of the photonic cooler when its surface is at ambient air temperature (zero temperature reduction), measured on a rooftop"
        scope: device
        conditions: "seven-layer HfO₂/SiO₂ photonic solar reflector and thermal emitter reflecting 97 % of sunlight and emitting in the 8–13 µm atmospheric window; direct sunlight exceeding 850 W/m²; at zero cooling load the cooler settled 4.9 °C below ambient air temperature"
        sources: [source:raman-2014]
        year: 2014
  environment: []
  summary: A photonic multilayer reflects sunlight and emits in the 8–13 µm window, cooling below ambient at noon.

