# Named, reviewed conversion pathways. `steps` is the ordered list of process
# claims from a disequilibrium to an output; the compiled path with the same
# claim sequence inherits this record's status, level and performance.
- id: pathway:thermoelectric-generator
  name: Thermoelectric generator
  steps: [claim:seebeck-drives, claim:seebeck-produces-carriers, claim:charge-carriers-convert-electricity]
  demonstrated_with: [transducer:thermoelectric-generator]
  evidence: [source:rowe-2006, source:snyder-toberer-2008, source:goldsmid-2016]
  status: commercial
  knowledge_level: K8
  performance:
    # pass 35: efficiency_typical 0.05 removed — a typical needs a population source whose page has been read (the reviewer's ruling); the value stays in the audit record
    # pass 35: efficiency_record 0.12 removed — exactly the structured Zhang 2017 datum below (the positive control); the display derives it
    # pass 42: theoretical_limit retired (already-typed, removed) — a limit lives in the typed constraint graph or nowhere; the text and its reason stay in design/reviews/loop-3/pass-42-dispositions.yaml
    # pass 37: power_density "≈ 1 W/cm² of module at ΔT = 200 K" removed — a summary power density stays only as a structured measurement with its denominator and basis (the reviewer's ruling); the value stays in the audit record
    measurements:
      - quantity: module conversion efficiency
        value: "12.0%"
        value_numeric: 0.12
        unit: "1"
        metric: conversion-efficiency
        basis: "module: electrical output over heat flow measured at the cold side"
        parameters: { T_h_K: 850, T_c_K: 300 }
        scope: module
        conditions: "Bi₂Te₃/skutterudite segmented 8-couple module, T_h = 850 K, T_c = 300 K (ΔT = 550 K), matched load; heat flow measured at the cold side"
        sources: [source:zhang-2017-segmented-teg]
        year: 2017
        note: record for a segmented module at the time of publication
      # pass 45: the handbook range "≈ 4–6 %" (Rowe 2006; Goldsmid 2016; T_h ≈ 500 K / T_c ≈ 300 K, matched load) removed — a population statement with no page read, a typical in a measurement's clothing; it returns only as a read population statement with its rule (design/reviews/loop-3/pass-45-dispositions.yaml)
      # pass 45: the solar-thermoelectric figure "4.6 %" (Kraemer 2011: flat-panel STEG, nanostructured Bi₂Te₃, AM1.5G with ~200× thermal concentration, vacuum, T_h ≈ 470 K) removed — another route's figure (radiation → absorber heat → thermoelectric) on the temperature-gradient pathway, unstructured; it belongs to a solar-thermoelectric pathway the atlas does not yet record
      # pass 45: the RTG system range "≈ 6–7 %" (Prelas 2014; Rowe 2006; Pu-238 MMRTG-class, T_h ≈ 800 K / T_c ≈ 470 K) removed — another route's figure (decay heat → thermoelectric) on the temperature-gradient pathway, and a handbook range with no page read; it returns on pathway:radioisotope-thermoelectric-generator once a read primary gives a named generator's system efficiency
  environment: [state-solid, temp-gradient-required]
  summary: Heat flows through n- and p-type legs; the Seebeck voltage drives the load. Used from radioisotope generators to waste-heat recovery.

