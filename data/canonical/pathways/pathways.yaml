- id: pathway:thermoacoustic-generator
  regime_provides: [thermal:gradient-above-thermoacoustic-critical]  # pass 30: self-sustained oscillation is the evidence that the stack ran above Swift's critical gradient
  name: Thermoacoustic engine with linear alternator
  steps: [claim:thermoacoustic-drives, claim:thermoacoustic-produces-sound, claim:acoustic-drives-linear-alternator, claim:linear-alternator-produces, claim:charge-carriers-convert-electricity]
  demonstrated_with: [transducer:thermoacoustic-engine]
  evidence: [source:swift-1988]
  status: prototype
  knowledge_level: K7
  performance:
    # pass 44: restored as structured measurements from two open publisher abstracts (Wu 2014; Bi 2017) — the maximum-efficiency and
    # maximum-power operating points are separate data, never combined; Backhaus, Tward & Petach 2004 stays a full-text item
    measurements:
      - quantity: thermal-to-electrical conversion efficiency at the maximum-efficiency point
        value: "19.8%"
        value_numeric: 0.198
        unit: "1"
        metric: conversion-efficiency
        basis: "electric power over heat input to the engine, as the abstract states it; the paper's heat-input measurement is not on record (abstract only)"
        parameters: { T_h_K: 923.15, T_c_K: 288.15 }
        scope: laboratory
        datum_kind: measured
        conditions: "1 kW-class travelling-wave thermoacoustic electrical generator with a linear alternator; 4.0 MPa mean pressure; 64 Hz after 4.5 % mole fraction argon; electric output 970 W at this point; heating 650 °C, cooling 15 °C"
        sources: [source:wu-2014-1kw-thermoacoustic-generator]
        year: 2014
      - quantity: maximum electric power
        value: "1043 W"
        value_numeric: 1043
        unit: W
        metric: power
        basis: "electric output at the maximum-power operating point"
        scope: laboratory
        datum_kind: measured
        conditions: "the same generator; 17.7 % thermal-to-electrical efficiency at this point, not the maximum efficiency"
        sources: [source:wu-2014-1kw-thermoacoustic-generator]
        year: 2014
      - quantity: thermal-to-electric conversion efficiency at the maximum-efficiency point
        value: "18.4%"
        value_numeric: 0.184
        unit: "1"
        metric: conversion-efficiency
        basis: "electric power over heat input to the engine, as the abstract states it; the paper's heat-input measurement is not on record (abstract only)"
        parameters: { T_h_K: 923.15, T_c_K: 298.15 }
        scope: laboratory
        datum_kind: measured
        conditions: "three-stage travelling-wave thermoacoustic electric generator, units joined end-to-end by slim resonance tubes with a linear alternator as a bypass at the end of each; 6 MPa pressurised helium; electric output 3.46 kW at this point; heating 650 °C, cooling 25 °C"
        sources: [source:bi-2017-5kw-thermoacoustic-generator]
        year: 2017
      - quantity: maximum electric power
        value: "4.69 kW"
        value_numeric: 4690
        unit: W
        metric: power
        basis: "electric output at the maximum-power operating point"
        scope: laboratory
        datum_kind: measured
        conditions: "the same three-stage generator; 15.6 % thermal-to-electric efficiency at this point, not the maximum efficiency"
        sources: [source:bi-2017-5kw-thermoacoustic-generator]
        year: 2017
