- id: pathway:rankine-steam-plant
  name: Steam Rankine plant
  steps: [claim:expansion-drives, claim:expansion-produces-motion, claim:motion-drives-generator, claim:generator-produces-carriers, claim:charge-carriers-convert-electricity]
  demonstrated_with: [transducer:rankine-cycle-plant]
  evidence: [source:bejan-2016, source:shaheed-2023-al-mosyab, source:nicol-2015-ieaccc-double-reheat]
  status: commercial
  knowledge_level: K8
  auxiliary_requirements:
    # pass 36: the feedwater pump is an internal cycle load off the route; it establishes no regime token — claim:expansion-drives is the cycle-level temperature-gradient abstraction and does not require the expansion pressure drop
    - kind: recirculating-work
      energy_form: mechanical
      purpose: feedwater pump
      establishes: []
      conditions:
        - "condensed working fluid is pumped from condenser pressure to boiler pressure before heat addition; pump work is an internal cycle load and whole-cycle net efficiency includes it"
        - "Al-Mosyab Unit 3 (Shaheed, Mohammed & Radhi 2023, read in full): three main boiler feedwater pumps and three condensate pumps with a deaerator return the condensate to the 152 bar main-steam pressure; the boiler feed pump appears in the unit's exergy ledger (Table 4)"
      evidence: [source:shaheed-2023-al-mosyab]
      note: "recorded on the reviewer's pass-36 ruling; not on pathway:steam-engine (a generic spelling demonstrated by the Rankine transducer — a pathway-specificity item for a later architecture audit) and not on pathway:nuclear-steam-plant (which owes the pressure-drop provider and awaits a source review of its named architecture)"
  performance:
    # pass 35: efficiency_typical 0.38 removed — a typical needs a population source whose page has been read (the reviewer's ruling); the value stays in the audit record
    # pass 35: efficiency_record 0.47 migrated to the Nordjylland 3 datum below (net, LHV, power-only, not annual); the display derives it
    theoretical_limit: "Carnot between the hot and cold reservoirs defined for the cycle."  # pass 39: the Curzon–Ahlborn clause removed — a benchmark at maximum power, typed as constraint:curzon-ahlborn-limit, never a bound
    measurements:
      - quantity: net plant electrical efficiency
        value: "47%"
        value_numeric: 0.47
        unit: "1"
        metric: conversion-efficiency
        basis: "operating net electrical efficiency (electrical output to the 400 kV grid over fuel energy); fuel lower-heating-value basis; power-only (condensing) mode — an operating figure, not an annual one"
        parameters: { T_turbine_inlet_K: 853.15, T_cooling_water_inlet_K: 283.15 }
        scope: plant
        conditions: "Nordjylland unit 3, Denmark (415 MWe, commissioned 1998): once-through ultra-supercritical Benson tower boiler, double reheat, 580 °C / 580 °C / 580 °C at 29 MPa, 10 °C seawater cooling; 2005 performance in power-only mode at 100 % load — generator 411 MWe, auxiliaries 26 MWe, 385 MWe to grid, boiler efficiency 94.2 %, heat rate 7151.4 kJ/kWh on generator output; the world's most efficient pulverised-coal unit as of December 2014 per the IEA Clean Coal Centre"
        sources: [source:nicol-2015-ieaccc-double-reheat]
        year: 2015
        note: "read in full in CCC/255 §7.2.6 and Table 4 (Poulsen & Bendixen 2006); the table's own 47.2 % (400 kV to grid) row sits beside a coal calorific value labelled gross (26 MJ/kg) while the text gives 25.2 MJ/kg LHV / 26.4 MJ/kg HHV, so the atlas records the text's explicit net-LHV statement; the second reader's Morrison 2008 IEA CCC citation (47 % LHV / 44.9 % HHV) could not be located — CCC/255 cites Morrison 2011 for the same fact; the steam temperature and cooling-water temperature are operating states, never the Carnot reservoirs"
      # Loop-3 pass 33: Shaheed, Mohammed & Radhi 2023 read in full — the unit's readings and the computed efficiency kept apart (findings 15–16).
      - quantity: unit electrical load at the recorded operating state
        value: "225 MW"
        value_numeric: 225000000
        unit: W
        parameters: { T_turbine_inlet_K: 812.15, T_cooling_water_inlet_K: 297.15 }
        scope: plant
        conditions: "Al-Mosyab thermal power station, Iraq (completed 1990, four 300 MW units), Unit 3 at 225 MW load — Table 1 'general current operation condition': main steam 168 kg/s at 152 bar and 539 °C, crude-oil fuel 14.68 kg/s at NCV 10,074 kcal/kg, condenser pressure 0.1 bar, cooling-water temperature 24 °C, generator 3000 rpm; subcritical single-drum natural-circulation boiler, HP / IP / LP turbines, six closed feedwater heaters and a deaerator"
        sources: [source:shaheed-2023-al-mosyab]
        year: 2023
        note: "the unit's readings, not the design condition (300 MW, 170 bar, 538 °C, 0.0653 bar, 23 °C cooling water); pressures stay in the conditions text — the registry has no pressure names; the operating-state temperatures never feed the Carnot bound"
      - quantity: cycle thermal efficiency (energy balance of the readings)
        value: "39.3%"
        value_numeric: 0.393
        unit: "1"
        metric: conversion-efficiency
        basis: "first-law efficiency of the cycle from the authors' Engineering Equation Solver model of the Unit 3 readings (Table 4, 'cycle' row); the heat input is the heat added to the working fluid (boiler thermal efficiency 94 % in the same table), not the fuel's NCV"
        parameters: { T_turbine_inlet_K: 812.15, T_cooling_water_inlet_K: 297.15 }
        scope: model
        datum_kind: derived
        conditions: "derived from the actual 225 MW operating readings above; the same model gives second-law efficiency 34.91 % and exergy destruction 412.68 MW"
        sources: [source:shaheed-2023-al-mosyab]
        year: 2023
        note: "Source-internal discrepancy: Table 4 reports cycle thermal efficiency 39.3%; surrounding prose reports 39.91%. The atlas records the tabulated value because Table 4 is the paper's declared energy/exergy result table; no reconciliation is supplied by the authors (Figure 2's condenser-pressure sweep gives 39.39 % at 0.06 bar falling to 37.97 % at 0.24 bar; the unit runs at 0.1 bar). Computed, not metered. Not a record figure: efficiency_record 0.47 stands"
  environment: [temp-gradient-required]
  summary: Heat raises steam; the turbine turns the generator. Most of the world's thermal electricity.

- id: pathway:combustion-gas-turbine
  name: Combustion gas-turbine plant
  steps: [claim:combustion-drives, claim:combustion-produces-hot-gas, claim:hot-gas-drives-expansion, claim:expansion-produces-motion, claim:motion-drives-generator, claim:generator-produces-carriers, claim:charge-carriers-convert-electricity]
  demonstrated_with: [transducer:gas-turbine-generator]  # pass 34: had pointed at the Rankine plant transducer
  evidence: [source:bejan-2016, source:dixon-hall-2014, source:al-mhanna-2024-isccs]
  status: commercial
  knowledge_level: K8
  regime_provides: [thermodynamic:expansion-pressure-drop]  # pass 36: the compressor its own shaft drives establishes the pressure ratio (Al Mhanna 2024: 9.4 bar compressor discharge, 1 bar turbine discharge); explained by the auxiliary requirement below, never by combustion
  auxiliary_requirements:
    - kind: recirculating-work
      energy_form: mechanical
      purpose: compressor
      establishes: [thermodynamic:expansion-pressure-drop]
      conditions:
        - "turbine shaft work drives the compressor that establishes the expansion pressure ratio; cycle net work is turbine work minus compressor work"
        - "the local plant of Al Mhanna 2024: air 505.36 kg/s compressed from 0.9981 bar to 9.4 bar (isentropic efficiency 0.883) before the combustor, turbine discharge 1 bar"
      evidence: [source:dixon-hall-2014, source:al-mhanna-2024-isccs]
      note: "a feedback branch (turbine motion → compressor → pressurised inlet → combustor → turbine), not a serial step, so it is metadata here and never a route claim; whole-cycle and net efficiencies include this back-work while the enumerated route is the useful-output causal spine"
  performance:
    # pass 35: efficiency_typical 0.40 removed — a typical needs a population source whose page has been read (the reviewer's ruling); the value stays in the audit record
    # pass 34: efficiency_record 0.64 removed — it was the combined cycle's figure, which lives on system-pathway:natural-gas-combined-cycle
    theoretical_limit: "Carnot between a hot and a cold reservoir a source defines — none recorded: the turbine inlet temperature is an operating state, not a reservoir (pass 31)"
    notes: "model relation, not a bound of the real pathway: the ideal air-standard Brayton cycle's thermal efficiency is 1 − r_p^((1−γ)/γ) at pressure ratio r_p, with net work the turbine work minus the compressor work; a real cycle's net efficiency depends on both and on the turbine inlet temperature the materials allow"
    measurements:
      # Loop-3 pass 33: Al Mhanna, Al Hadidi & Al Maskari 2024 read in full — the plant's gas-turbine figures only (findings 18–20).
      - quantity: gas-turbine work output
        value: "127 MW"
        value_numeric: 127000000
        unit: W
        parameters: { T_turbine_inlet_K: 1323.15, T_turbine_exhaust_K: 813.85 }
        scope: plant
        conditions: "Table 3 'local plant data' of a 678 MW combined-cycle gas-turbine station in Oman (three gas turbines, two steam turbines; one gas-turbine train modelled): gas-turbine inlet 1050 °C, exhaust 540.7 °C; Table 2 plant inputs — air 505.36 kg/s at 26.6 °C and 0.9981 bar, compressor discharge 9.4 bar, natural-gas fuel 9.2 kg/s at 22.8 bar (LHV 43,662 kJ/kg, 92.5 % methane), turbine discharge 1 bar"
        sources: [source:al-mhanna-2024-isccs]
        year: 2024
        note: "the steam turbine of the same train delivers 61.5 MW and the table's 46.93 % is the combined cycle's efficiency — (127 + 61.5) MW over 9.2 kg/s × 43,662 kJ/kg = 401.7 MW reproduces it exactly — so it belongs to no pathway the atlas spells (the gas-turbine share alone would be 127 / 401.7 ≈ 31.6 %, a derivation, not a source figure); the paper's Aspen Plus simulation reproduces the plant within 0.43–3.77 % (126.45 MW, 1010.46 °C, 556.93 °C, 46.28 %) and is not recorded"
  environment: [state-gas, temp-high]
  summary: Fuel burns, hot gas expands through the turbine, the shaft turns the alternator.

- id: pathway:otec-plant
  name: Ocean thermal energy conversion plant
  steps: [claim:otec-drives, claim:otec-produces-motion, claim:motion-drives-generator, claim:generator-produces-carriers, claim:charge-carriers-convert-electricity]
  evidence: [source:claude-1930, source:bejan-2016, source:lu-2024-otec-platform]
  status: prototype
  knowledge_level: K7
  performance:
    # pass 35: efficiency_typical 0.03 removed — a typical needs a population source whose page has been read (the reviewer's ruling); the value stays in the audit record
    theoretical_limit: "Carnot between the warm surface water and the deep cold water a source defines"
    measurements:
      # Loop-3 pass 33: Lu et al. 2024 read in full — the design point and the experiment kept apart (the reviewer's finding 12).
      - quantity: system thermal efficiency (design point)
        value: "2.63%"
        value_numeric: 0.0263
        unit: "1"
        metric: conversion-efficiency
        basis: "as reported: the engineering-calibration check value of the 50 kW design (Table 2); the table's turbine output 50.3 kW and evaporator heat absorption 1608.56 kW do not reproduce it by simple ratio, so the definition is the authors'"
        parameters: { T_h_K: 301.15, T_c_K: 277.15 }
        scope: model
        datum_kind: design-point
        conditions: "design point of a land-based 50 kW R134a organic-Rankine OTEC platform: 28 °C warm-seawater source, 4 °C cold-seawater source; Table 1 state points ≈ 24.6 °C / 645.8 kPa evaporation and ≈ 8 °C / 387.6 kPa condensation; check values warm seawater 191.49 kg/s, cold seawater 183.93 kg/s, working fluid 7.648 kg/s, turbine output 50.3 kW"
        sources: [source:lu-2024-otec-platform]
        year: 2024
        note: "a model-scope datum: it supplies no regime to the route; the initial thermodynamic calculation gave 3.22 % and 51.08 kW before the pressure-drop check"
      - quantity: actual system thermal efficiency
        value: "2.46%"
        value_numeric: 0.0246
        unit: "1"
        metric: conversion-efficiency
        basis: "as reported: the authors' actual thermal efficiency in the stable-operation phase (Figure 12), defined as in their design check"
        scope: laboratory
        conditions: "the same platform run on land with a heat-pump unit simulating the seawater; the conclusion states the heat source was held at 24–28 °C and the cold source at 4–8 °C, while Figure 11 shows the warm water at ≈ 27.5–30.5 °C and the cold water at ≈ 4.5–7 °C over the 6000 s run with the flows stepped from ≈ 530 to ≈ 740 m³/h; the turbine supply valve fully open from ≈ 3900 s"
        sources: [source:lu-2024-otec-platform]
        year: 2024
        note: "no T_h_K / T_c_K: the paper prints no temperature pair for the operating point of the reported efficiency, and the run's temperatures are read only from Figure 11 (≈ 30 °C / ≈ 6.3 °C at the moment of peak power) — a graphical reading, not recorded as parameters; 28 °C / 4 °C is the design point, not this datum's"
      - quantity: maximum grid-connected electrical power
        value: "47.4 kW"
        value_numeric: 47400
