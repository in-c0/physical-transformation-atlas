- id: pathway:thermo-driven-nanofluidic-converter
  name: Thermo-driven nanofluidic electrokinetic converter
  steps: [claim:temperature-drives-thermo-osmosis, claim:thermo-osmosis-couples-streaming, claim:streaming-produces-ions, claim:ionic-current-converts-electricity]
