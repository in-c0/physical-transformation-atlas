        year: 2026
        note: one laboratory demonstration in a conference series; the atlas records it as demonstrated, not replicated
  environment: [state-liquid, state-solid, medium-non-centrosymmetric]
  summary: Wave motion drives impact balls against stacked piezoelectric discs; the impact stress is the pressure step the atlas records between wave motion and elastic deformation, a coarse but faithful spelling of impact loading.
