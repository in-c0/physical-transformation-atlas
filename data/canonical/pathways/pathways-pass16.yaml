# Loop-3 pass 16: the frontier's thirteen candidate compositions audited as physics. Eight of them
# turned out to be demonstrated devices the atlas had no pathway record for; two are literature
# proposals (status proposed, which never makes a route "demonstrated"). Every figure was read in the
# source before it was written here.
- id: pathway:thermocapillary-micromotor
  name: Thermocapillary micromotor
  steps: [claim:temperature-drives-marangoni, claim:marangoni-produces-motion, claim:motion-converts-mechanical-work]
  demonstrated_with: [transducer:thermocapillary-micromotor]
  evidence: [source:maggi-2015-thermocapillary-gears]
  status: demonstrated
  knowledge_level: K5
  performance:
    measurements:
      - quantity: rotation rate
        value: "up to 300 r.p.m."
        scope: device
        conditions: "microfabricated asymmetric gears on a liquid–air interface under wide-field incoherent illumination; the temperature gradient that drives the thermocapillary flow is produced by the light the gear absorbs"
        sources: [source:maggi-2015-thermocapillary-gears]
        year: 2015
        note: rotational work against viscous drag; no load other than the fluid was measured
  environment: [state-liquid, temp-gradient-required]
  summary: Absorbed light heats an asymmetric floating gear unevenly; the surface-tension gradient around it drives a thermocapillary flow whose stress torques the gear. The temperature gradient is the driver; light is how it is prepared.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 16 (frontier candidates audited as physics; source read)" }
