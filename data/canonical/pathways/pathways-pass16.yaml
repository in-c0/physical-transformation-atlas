- id: pathway:thermocapillary-streaming-generator
  name: Thermocapillary streaming-potential generator (proposed)
  steps: [claim:temperature-drives-marangoni, claim:marangoni-produces-flow, claim:fluid-flow-carrier-drives-streaming, claim:streaming-produces-ions, claim:ionic-current-converts-electricity]
  evidence: [source:pini-2015-surface-tension-streaming]
  status: proposed
  knowledge_level: K3
  performance:
    theoretical_limit: "Carnot between the hot and cold ends of the free surface; Pini, Baier and Dietzel compare the maximal thermal efficiency with it and find thermocapillary drive limited by the heat capacity of aqueous solvents"
  environment: [state-liquid, env-aqueous, temp-gradient-required, charged-surface-required]
  summary: A temperature gradient along a free electrolyte surface drives a thermocapillary shear flow past a charged wall, whose streaming potential is the electrical output. Analysed theoretically and numerically; no physical demonstration is recorded, so the route stays a candidate.
  review: { canonical: true, last_reviewed: "2026-09-20", reviewer: "loop-3 pass 16 (frontier candidates audited as physics; abstract read)" }
- id: pathway:solutocapillary-streaming-generator
  name: Solutocapillary streaming-potential generator (proposed)
  steps: [claim:surface-drives-marangoni, claim:marangoni-produces-flow, claim:fluid-flow-carrier-drives-streaming, claim:streaming-produces-ions, claim:ionic-current-converts-electricity]
  evidence: [source:pini-2015-surface-tension-streaming, source:zhang-2026-marangoni-hydrovoltaic]
  status: proposed
  knowledge_level: K3
  performance:
    theoretical_limit: "the same analysis finds concentration-driven (destillocapillary) flows more promising than thermocapillary ones"
    notes: "Zhang et al. 2026 physically demonstrated a graphene-oxide evaporator in which a programmed chemical/surface-tension gradient sustained Marangoni microcirculation alongside capillary flow while the device delivered 25 μA short-circuit current, 0.7 V open-circuit voltage and powered an LED. Route review: driver-only-modifies because capillary and Marangoni transport are simultaneous co-drivers and the electrical contribution of the Marangoni branch was not isolated. Its figures belong to the combined device and are not recorded here."
  environment: [state-liquid, env-aqueous, charged-surface-required]
  summary: A surfactant-concentration difference along a free electrolyte surface drives a solutocapillary shear flow past a charged wall, whose streaming potential is the electrical output. Theoretical and numerical only; the route stays a candidate — the nearest physical device (Zhang 2026) runs the Marangoni flow as a co-driver beside capillary transport.
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 22 (Zhang 2026 abstract read; the co-driver device recorded as a note under the parallel-driver rule)" }
# Loop-3 pass 20: the last two candidate compositions. The resonance-expanded spellings the frontier
# showed are representation-equivalent to these direct routes; a resonance is an operating condition, not
# a conversion of its own.
- id: pathway:flexoelectric-vibration-harvester
  name: Flexoelectric vibration harvester
  steps: [claim:vibration-drives-elastic, claim:elastic-produces-stress, claim:flexo-drives, claim:flexo-produces-charge, claim:surface-charge-converts-electricity]
  demonstrated_with: [transducer:flexoelectric-vibration-harvester]
  evidence: [source:yang-2025-flexoelectric-harvester]
  status: demonstrated
  knowledge_level: K5
  performance:
    measurements:
      - quantity: output voltage
        value: "≈ 0.19 V average"
        value_numeric: 0.19
        unit: V
        scope: laboratory
        conditions: "two-stage stepped epoxy cantilever with an unpolarised α-PVDF flexoelectric layer (60 × 10 mm, 45 μm) on a vibration exciter, sinusoidal 20 Hz, measured acceleration 0.915 g; off resonance (the 1.2 Hz resonance was beyond the shaker)"
        sources: [source:yang-2025-flexoelectric-harvester]
        year: 2025
        note: "the paper's 3.58 V and 94.93 mW m⁻³ at resonance are theory and finite elements, not measurements, and are not recorded here"
  environment: [state-solid, medium-dielectric]
  summary: Base vibration bends a dielectric cantilever; the bending strain gradient, not piezoelectricity, polarises the unpolarised PVDF layer and the electrodes deliver charge to a load. Demonstrated off resonance; resonance is an amplifying operating condition, not a step of the composition.
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 20 (the last two candidate compositions audited as physics; source read in full)" }
