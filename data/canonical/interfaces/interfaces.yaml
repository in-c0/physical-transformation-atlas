# Interface records (loop-3 pass 26): a physical boundary between two regions of a device — recorded between two
# adjacent claims (the handoff it carries) or within one claim (a boundary internal to a conversion step). A
# demonstrated record resolves the region transition it names; a theoretical or proposed one is shown on the
# route and leaves the boundary check unresolved. Kinds and statuses are enumerated in the schema.
- id: interface:thermoacoustic-piezoelectric-gas-solid
  location: { between_claims: { from_claim: claim:thermoacoustic-produces-sound, to_claim: claim:acoustic-wave-drives-piezoelectric } }
  kind: gas-solid-acoustic-boundary
  from_region: resonator-gas
  to_region: piezoelectric-element
  carrier: carrier:acoustic-wave
  handoff_token: null
  relation: null
  conditions:
    - the resonator pressure field directly loads a solid piezoelectric membrane or diaphragm; no active intermediate acoustic transducer is required
  evidence: [source:zheng-2022-thermoacoustic-pan, source:smoker-2012-thermoacoustic-piezoelectric]
  status: demonstrated
  notes: "Two geometries of one physical handoff: Zheng et al. 2022 drove a thermally stabilised PAN membrane in a mini engine's sound field (102 V / 10 μA peak); Smoker et al. 2012 placed a piezoelectric diaphragm at the opposite end of a standing-wave resonator and compared the integrated device with theory. Neither reports an incident-to-transmitted acoustic intensity coefficient. Renamed in pass 27 from interface:thermoacoustic-pan-membrane once the evidence covered both."
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 27 (renamed and widened to Smoker 2012 on the second reader's ruling; pass 26 wrote the PAN record)" }
- id: interface:thermoacoustic-triboelectric-piston
  location: { between_claims: { from_claim: claim:thermoacoustic-produces-sound, to_claim: claim:acoustic-wave-drives-triboelectric } }
  kind: gas-solid-acoustic-boundary
  from_region: resonator-gas
  to_region: triboelectric-actuator
  carrier: carrier:acoustic-wave
  handoff_token: null
  relation: null
  conditions:
    - thermoacoustic pressure oscillations mechanically drive the piston / contact-separation assembly without an intervening electrical transducer
  evidence: [source:li-2026-thermoacoustic-teng]
  status: demonstrated
  notes: "The piston is apparatus at this boundary and adds no conversion phenomenon to the route. Ahmed et al. 2025 (a mercury–Kapton sliding TENG on a thermoacoustic engine, 18.8 V / 3.2 μA per layer) shows the family does not require a solid piston, but its gas–liquid–solid boundary is physically different and is not folded into this record."
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 27 (the second reader's fourth interface record; abstract read)" }
- id: interface:mhd-plasma-electrodes
  location: { within_claim: claim:mhd-produces }
  kind: electrode-contact
  from_region: plasma-channel
  to_region: electrode
  carrier: carrier:charge-carriers
  handoff_token: null
  relation: null
  conditions:
    - the conducting plasma crosses the magnetic field in the generator channel; the induced current is collected at solid electrodes into the external circuit
    - the solid electrode is a boundary of the plasma channel, not the active medium of the MHD effect
  evidence: [source:rosa-1961-mhd]
  status: demonstrated
  notes: "Rosa's experimental MHD work (Physics of Fluids 4, 182–194, 1961: an experimental 10 kW generator) used a conducting high-temperature gas and electrodes; the electrode boundary must not make the plasma conversion step inherit state-solid."
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 26 (the second reader's second interface record; the false gas–solid conflict was removed by the carrier fix, this record names the real boundary)" }
- id: interface:thermoacoustic-acoustoelectric-gas-solid
  location: { between_claims: { from_claim: claim:thermoacoustic-produces-travelling-sound, to_claim: claim:acoustic-wave-drives-acoustoelectric } }
  kind: gas-solid-acoustic-boundary
  from_region: resonator-gas
  to_region: acoustoelectric-solid
  carrier: carrier:acoustic-wave
  handoff_token: acoustic:travelling-wave
  relation:
    formula: "I₂ = T_I I₁; T_I = 4 Z₁ Z₂ / (Z₁ + Z₂)^2"
    input: quantity:acoustic-intensity
    output: quantity:acoustic-intensity
    coefficient_unit: "1"
    coefficient_name: normal-incidence acoustic intensity transmission coefficient T_I
    conventions: "ideal plane boundary at normal incidence; Z₁ and Z₂ are the characteristic acoustic impedances of the gas and the solid; matching layers, finite geometry and dissipative losses neglected"
  conditions:
    - the travelling gas-borne acoustic wave mechanically loads the acoustoelectric solid directly; an electrically driven piezoelectric or IDT launcher would instead create a longer-chain implementation
  evidence: [source:zheng-2022-thermoacoustic-pan]
  status: theoretical
  notes: "Zheng 2022 physically demonstrates direct thermoacoustic gas-wave coupling into a solid piezoelectric membrane, establishing that an active intermediate launcher is not required. No experiment is recorded in which this boundary directly drives a Weinreich-type semiconductor; the ideal transmission relation is a model for the candidate interface, not a measured datum — for 30-bar helium (Z ≈ 4.9 × 10³ Pa·s/m) on germanium (≈ 2.9 × 10⁷ Pa·s/m) it gives T_I ≈ 7 × 10⁻⁴, an illustration only."
  review: { canonical: true, last_reviewed: "2026-09-21", reviewer: "loop-3 pass 26 (the second reader's third interface record; the candidate's gas–solid transition named and modelled, not measured)" }
