# Physics domains used for coverage accounting.
#
# `target_inventory` is the checklist of phenomena a thorough first broad release of the domain
# would carry: the slugs already recorded plus the ones still missing. `target_phenomena` is
# derived from it by the loader (inventory length) and is what the scope-fill bars divide by.
# Scope targets are maintained checklists of phenomena the atlas intends to represent; they are
# editorial and revisable; they are NOT estimates of the total number of phenomena that exist.
# `target_basis` says how the list was assembled. Recorded slugs must exist as phenomenon ids;
# missing ones are the work queue. Loop-3 pass 11 (20/09/2026) turned five scalar targets into
# inventories on review and left the other nine as inventories reconstructed from the old scalar.
- id: thermodynamics
  name: Thermodynamics
  summary: Heat, work, temperature and entropy; thermal-to-anything conversion and its bounds.
  target_basis: "Cross effects that belong to solid-state transport, electrochemistry or spin systems are counted there, not here (pass 11: 40 → 25)."
