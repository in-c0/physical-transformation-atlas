# Loop-3 pass 42: the retirement of Pathway.performance.theoretical_limit — one disposition per prose row, in the reviewer's
# four classes (the pass-41 reply, findings 25–39): already-typed (the prose repeats a bound already reachable through the
# route's typed graph → deleted, nothing added) · generic-bound-missing (a generic physical bound the graph lacked → a constraint
# entity and a bounded_by claim on the right phenomenon, with evidence) · pathway-specific-bound (valid only for the exact
# reviewed architecture → a typed Pathway.bounds[] entry with evidence) · not-a-bound (benchmark / resource / projection /
# commentary → its correct typed representation, a performance note, or removal). `was` is the field at audit; `bound_before`
# the route's thermodynamic-bound result at revision ca0172056e74, before the sweep — tools/audit-limits.mjs asserts it is
# unchanged wherever the class says nothing was added (the reviewer's finding 37) and that the added constraint is reachable
# wherever one was.
policy:
  theoretical_limit: "a limit lives in the typed constraint graph or nowhere: a constraint entity keeps the canonical formula, metric, applicability filters and required basis; a bounded_by claim on a phenomenon attaches it generically with evidence; a Pathway.bounds[] entry attaches an upper-bound or formula-bound constraint to one exact architecture with evidence and is refused when the bound is already reachable from the route; the thermodynamic-bound check merges both through one applicability / metric / basis machinery; after the sweep the field is unwritable (strict performance object) and the route page lists the typed bounds instead of prose"
