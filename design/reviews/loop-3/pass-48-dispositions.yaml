# Loop-3 pass 48: the electrical output-form / terminal-boundary audit (the reviewer's pass-47 findings 13–14). Two tables, joined to
# the compiled graph by tools/audit-electrical-form.mjs and gated in the suite. Nothing here is served or typed: a form is recorded
# where an atlas record STATES it (a claim's conditions or a datum's conditions / basis — quoted in `stated`), and `unspecified` where
# none does; the auditor's physics reading sits in its own column and never becomes a form. No token, carrier or schema field is
# added for a waveform (findings 3, 5, 14): typed structure only where a downstream claim consumes it, and the audit shows none does.
#
# producers: one row per claim that delivers an electrical carrier (the phenomenon → carrier step of every electricity-ending route).
#   form: dc | ac | rf-oscillatory | pulsed | unspecified  — only from an atlas record, quoted in `stated`
#   reading: the auditor's physics reading of the waveform the effect delivers (descriptive; never a form)
producers:
  - claim: claim:galvanic-produces-ions
    form: unspecified
    reading: dc (a redox cell drives a unidirectional current at its open-circuit potential)
  - claim: claim:fuel-cell-produces-ions
    form: unspecified
    reading: dc
  - claim: claim:concentration-cell-produces
    form: unspecified
    reading: dc
  - claim: claim:red-produces-ions
    form: unspecified
    reading: dc (ionic current through stacked membranes, collected at the electrodes as a direct current)
  - claim: claim:capmix-produces
    form: unspecified
    reading: cyclic (charge and discharge alternate with the salinity switch; net energy per cycle)
  - claim: claim:amtec-produces-ions
    form: unspecified
    reading: dc
  - claim: claim:betavoltaic-produces-pairs
    form: dc
    stated: "datum on pathway:betavoltaic-battery — 'J_sc 10.60 nA cm⁻², V_oc 76.92 mV, FF 17.41 %; I–V by sourcemeter' (Kim 2026) and 'I_sc 2.91 nA, V_oc 1.41 V, FF 0.81' (Zhang 2025): an I–V characteristic with an open-circuit voltage and a short-circuit current is a direct-current source"
    reading: dc
  - claim: claim:piezo-produces-charge
    form: unspecified
    reading: ac or pulsed (charge follows the strain rate; a vibrating cantilever gives an alternating output, an impact a pulse)
  - claim: claim:flexo-produces-charge
    form: unspecified
    reading: ac (follows the strain-gradient rate under vibration)
  - claim: claim:tribo-produces-charge
    form: unspecified
    reading: pulsed (contact–separation cycles give alternating pulses)
  - claim: claim:droplet-produces-charge
    form: pulsed
    stated: "datum on pathway:droplet-electricity-generator — 'instantaneous peak output power per unit device area at the optimal load; a per-impact peak, not a time-averaged density'"
    reading: pulsed (one pulse per droplet impact)
  - claim: claim:electrostatic-produces
    form: unspecified
    reading: ac (a variable capacitor at a bias charges and discharges each vibration cycle)
  - claim: claim:rew-produces
    form: ac
    stated: "datum on pathway:reverse-electrowetting-harvester — 'arrays of droplets oscillated against nanometre-thick multilayer dielectric films at tens of hertz'; instantaneous resistive-load electrical power"
    reading: ac (at the droplet oscillation frequency)
  - claim: claim:induction-produces-carriers
    form: unspecified
    reading: ac (a coil sees an alternating flux from a passing magnet or a vibrating armature; bursts for an oscillatory engine)
  - claim: claim:magnetoelectric-produces
    form: unspecified
    reading: ac (the induced polarisation follows the applied alternating field)
  - claim: claim:streaming-produces-ions
    form: unspecified
    reading: dc (a steady pressure-driven or thermo-osmotic flow gives a steady streaming current)
  - claim: claim:hydrovoltaic-produces-ions
    form: unspecified
    reading: dc (steady evaporation-driven flow)
  - claim: claim:mhd-produces
    form: unspecified
    reading: dc (a Faraday generator with a steady flow and a steady field delivers a direct current between its electrodes)
  - claim: claim:photon-drag-produces
    form: unspecified
    reading: follows the illumination (dc under continuous illumination, pulsed under pulsed light)
  - claim: claim:ionic-te-produces
    form: unspecified
    reading: transient (a thermodiffusion-charged capacitor delivers energy on discharge; steady-state current is small)
  - claim: claim:acoustoelectric-produces
    form: unspecified
    reading: dc (a travelling acoustic wave drags carriers in one direction)
  - claim: claim:dember-produces-charge
    form: unspecified
    reading: transient (a photo-induced diffusion voltage, terahertz emission in the pulsed case)
  - claim: claim:ehd-produces
    form: unspecified
    reading: dc (injected monopolar charge carried by the flow against the field)
  - claim: claim:alphavoltaic-produces-pairs
    form: unspecified
    reading: dc
  - claim: claim:thermopolarization-produces-charge
    form: unspecified
    reading: transient (bound charge; a current only while the polarisation or the gradient changes)
  - claim: claim:pv-produces-pairs
    form: dc
    stated: "datum on pathway:photovoltaic-module — 'V_oc 83.04 V, I_sc 6.384 A, fill factor 82.9 %' (Green 2024): the confirmed I–V characteristic of a module is a direct-current characteristic; the thermophotovoltaic and radioluminescent data likewise report cell I–V output"
    reading: dc
  - claim: claim:bpv-produces
    form: unspecified
    reading: dc (a steady photocurrent under continuous illumination)
  - claim: claim:photoelectric-produces
    form: unspecified
    reading: dc (emitted electrons collected at the anode)
  - claim: claim:pete-produces
    form: unspecified
    reading: dc
  - claim: claim:antenna-produces
    form: rf-oscillatory
    stated: "claim conditions — 'an oscillating current at the wave frequency'"
    reading: rf-oscillatory (the antenna current alternates at the radiation frequency)
  - claim: claim:rectification-produces
    form: dc
    stated: "claim conditions — 'direct current out of the diode'; datum on pathway:rectenna-microwave — 'DC power delivered to the load over microwave power input'"
    reading: dc
  - claim: claim:ishe-produces
    form: unspecified
    reading: dc (a steady spin current gives a steady charge current; alternating under microwave spin pumping)
  - claim: claim:hall-produces
    form: unspecified
    reading: follows the driving current (dc for a dc current in a steady field)
  - claim: claim:seebeck-produces-carriers
    form: unspecified
    stated: "claim conditions say only 'carriers diffuse from the hot end and accumulate at the cold end'; the radiative-cooling TEG datum reports 'J_sc 44 mA, V_oc 79 mV' (a direct-current I–V) — recorded on that pathway's datum row, not as the claim's form"
    reading: dc (a steady gradient gives a steady thermoelectric voltage)
  - claim: claim:phonon-drag-produces
    form: unspecified
    reading: dc
  - claim: claim:thermionic-produces-carriers
    form: unspecified
    stated: "claim conditions — 'emitted electrons collected at the anode at a potential difference set by the work-function difference' (a potential difference, no waveform stated)"
    reading: dc
  - claim: claim:linear-alternator-produces
    form: unspecified
    reading: ac (a linear alternator's coil sees an alternating flux at the acoustic frequency — 64 Hz in Wu 2014's conditions)
  - claim: claim:pyro-produces-charge
    form: unspecified
    reading: ac (the pyroelectric current follows dT/dt and reverses with it)
  - claim: claim:thermogalvanic-produces-ions
    form: unspecified
    reading: dc
  - claim: claim:trec-produces-ions
    form: unspecified
    stated: "datum on pathway:thermally-regenerative-electrochemical-cycle — 'electrical energy per cycle over heat absorbed, cycled between 10 °C and 60 °C' (energy per cycle, no waveform stated)"
    reading: dc within each half-cycle; cyclic overall
  - claim: claim:nernst-produces
    form: unspecified
    reading: dc
  - claim: claim:anomalous-nernst-produces
    form: unspecified
    reading: dc
  - claim: claim:generator-produces-carriers
    form: unspecified
    reading: ac (alternating in the armature winding; a dynamo commutates it to dc — the atlas records neither)
  - claim: claim:thermoradiative-produces
    form: unspecified
    reading: dc

# boundaries: one row per electrical datum on a pathway or system ending at electricity — where its numerator sits relative to the
# conditioning and delivery stages, as the record's basis / conditions state it. boundary: terminals (the converter's own output
# terminals, dc or ac as the reading says) | after-power-electronics | grid (after the grid interface) | net-plant (net electrical
# output at the plant boundary) | per-event-peak (an instantaneous or per-event figure) | unstated. `stated` quotes the record.
