  - { pathway: pathway:rankine-steam-plant, field: efficiency_record, disposition: migrate-to-measurement, action: migrated, reason: "migrated to a structured plant datum on the reviewer's pass-35 ruling (findings 8–14): IEA Clean Coal Centre CCC/255 (Nicol 2015, read in full) states Nordjylland unit 3 reaches 47 % net electrical efficiency (LHV) in power-only mode — the world's most efficient PCC unit as of December 2014 — with Table 4's 2005 performance (411 MWe generator, 385 MWe to grid, 94.2 % boiler efficiency, 10 °C cooling water, 580/580/580 °C at 29 MPa); the naked 0.47 is deleted and the display derives it; Bugge, Kjær & Blum 2006 stays optional" }
  - { pathway: pathway:wind-turbine, field: efficiency_record, disposition: wrong-quantity, action: removed, reason: "pass 39: 0.52 is a rotor power coefficient, not the conversion efficiency of a pathway ending in electrical work — removed; a named rotor's C_p belongs as metric power-coefficient on rotor evidence" }
  - { pathway: pathway:hydroelectric-plant, field: efficiency_record, disposition: wrong-quantity, action: removed, reason: "pass 39: 0.95 is a hydraulic turbine efficiency (Francis model tests reach ≈ 95 %), not water-to-wire for a pathway that includes the generator — removed; a named plant's water-to-wire figure with its boundary returns as a measurement" }
  - { pathway: pathway:photovoltaic-module, field: efficiency_record, disposition: wrong-quantity, action: migrated, reason: "Green et al. 2024 (Version 63) read on Wiley: the crystalline-silicon module record is 24.7 ± 0.3 % (Maxeon, 112 cells, 17,806 cm² designated area, NREL 4/23, Table 4); 0.27 is the single-junction silicon cell record (26.8 ± 0.4 %, LONGi HJT, Table 1) rounded up, a cell figure on a module pathway; recorded as a module datum, the field deleted", was: 0.27 }
