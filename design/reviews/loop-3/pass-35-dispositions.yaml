# Loop-3 pass 35: the legacy performance audit — one disposition per (pathway, field) for every efficiency_typical,
# efficiency_record and theoretical_limit in data/canonical/pathways. tools/audit-performance.mjs joins this file to the
# compiled graph and writes pass-35-audit.md; it fails if any field lacks a disposition or any disposition names a
# field that no longer exists, so the table can never drift from the data. Dispositions (the second reader's list):
# verified-same-architecture · different-architecture · unsupported-generic · ambiguous-basis · model-only ·
# benchmark-not-bound · wrong-quantity · migrate-to-measurement · remove. `action` is what pass 35 did (or left).
policy:
  record: "a legacy efficiency_record stays only when a named same-architecture source supports that quantity with a stated basis; one exactly represented by a structured physical measurement is deleted and the display derived (findings 20, 27–28); pass 39 resolved the last six and the field is no longer writable — every record is a structured physical measurement"
  typical: "a typical needs a population source — a review or handbook characterising a range, or enough curated measurements to derive one under an explicit population rule (never one or two measurements); pass 35 removed every stored efficiency_typical (a value cited only to a single paper, a discovery paper or a projection is unsupported-generic; one cited to a book or review whose page is unread is ambiguous-basis) and the field is no longer writable — a typical returns only with the page that supports it, as a derived quantity (findings 2–7 of the pass-35 reply)"
  limit: "a theoretical_limit stays when it states a physical bound with its basis; a representative operating point presented as a number, an operating-state temperature used as a reservoir, a projection for a different architecture, or an arithmetic error is rewritten or removed (findings 22–24)"
dispositions:
  # ---- (a) cross-architecture and (b) semantically wrong limits / bases ----
  - { pathway: pathway:combustion-heater, field: theoretical_limit, disposition: wrong-quantity, action: removed, reason: "the higher heating value is an energy-input accounting basis, not an efficiency limit (finding 22); recorded only as a basis on a structured measurement when a source uses HHV", was: the higher heating value of the fuel }
  - { pathway: pathway:otec-plant, field: theoretical_limit, disposition: ambiguous-basis, action: rewritten, reason: "300 K / 280 K are representative temperatures, not a canonical operating point of every OTEC plant (finding 23); the typed Carnot constraint now evaluates the structured Lu 2024 data instead; the field keeps the bound's form without a number", was: Carnot ≈ 6.7% for 300 K against 280 K }
  - { pathway: pathway:mhd-generator, field: theoretical_limit, disposition: different-architecture, action: rewritten, reason: "'topping-cycle combinations projected at 50–60%' is a combined-cycle projection, the system layer's business, and 'Carnot at the plasma temperature' names an operating state as a reservoir; rewritten to the generic form", was: Carnot at the plasma temperature; topping-cycle combinations projected at 50–60% }
  - { pathway: pathway:photon-enhanced-thermionic-converter, field: theoretical_limit, disposition: different-architecture, action: removed, reason: "'> 40% projected for concentrated sunlight with a thermal bottoming cycle' couples a bottoming cycle to the converter — a system projection, and a projection (model-only) besides; Schwede et al. 2010's abstract is not on Crossref or OpenAlex, so what the source claims for the converter alone is unverified; removed rather than rewritten", was: "> 40% projected for concentrated sunlight with a thermal bottoming cycle" }
  - { pathway: pathway:solar-thermal-rankine, field: theoretical_limit, disposition: ambiguous-basis, action: rewritten, reason: "'Carnot at the receiver temperature' uses an operating state as a reservoir (pass 31); Landsberg 93.3 % for the solar conversion kept", was: Landsberg 93.3% overall; Carnot at the receiver temperature }
  - { pathway: pathway:nuclear-steam-plant, field: theoretical_limit, disposition: ambiguous-basis, action: rewritten, reason: "'Carnot at ~600 K steam ≈ 50%' uses a representative steam temperature as the hot reservoir; number removed, the generic form kept", was: Carnot at ~600 K steam ≈ 50% }
  - { pathway: pathway:rankine-steam-plant, field: theoretical_limit, disposition: ambiguous-basis, action: rewritten, reason: "'Carnot ≈ 65% for 873 K against 300 K' is a representative operating point presented as a number (the OTEC pattern) and 'Curzon–Ahlborn ≈ 41%' is a benchmark, never a bound (pass 19); numbers removed", was: Carnot ≈ 65% for 873 K against 300 K; Curzon–Ahlborn ≈ 41% at maximum power }
  - { pathway: pathway:thermally-regenerative-electrochemical-cycle, field: theoretical_limit, disposition: wrong-quantity, action: rewritten, reason: "'≈ 13% for 10–60 °C' is arithmetically wrong: 1 − 283.15/333.15 = 15.0 %; the number is removed and the bound left in its generic form — the migrated Lee 2014 datum carries the temperatures for the typed check", was: Carnot between the charge and discharge temperatures (≈ 13% for 10–60 °C) }
  - { pathway: pathway:thermoelectric-generator, field: theoretical_limit, disposition: ambiguous-basis, action: rewritten, reason: "the ideal-module relation is the bound (kept); 'with ZT ≈ 1 and T_h = 500 K, T_c = 300 K it gives ≈ 8%' is a worked example at a representative operating point, removed for the same reason as OTEC's number", was: "η = η_Carnot · (√(1+ZT) − 1)/(√(1+ZT) + T_c/T_h), the ideal-module relation for a constant-property leg pair; with ZT ≈ 1 and T_h = 500 K, T_c = 300 K it gives ≈ 8%" }
  - { pathway: pathway:thermoacoustic-generator, field: theoretical_limit, disposition: benchmark-not-bound, action: rewritten, reason: "'travelling-wave engines have reached ≈ 40% of Carnot' is a benchmark for the engine's thermal-to-acoustic conversion (Tijani & Spoelstra 2011 report 49 % of Carnot for an engine with no alternator), not a bound on this engine-plus-alternator pathway; the clause is removed", was: Carnot; travelling-wave engines have reached ≈ 40% of Carnot }
