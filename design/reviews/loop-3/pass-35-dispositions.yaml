  - { pathway: pathway:fuel-cell, field: efficiency_record, disposition: ambiguous-basis, action: removed, reason: "pass 39: no named hydrogen fuel-cell device at 65 % with an LHV / HHV and gross / net basis; direct-hydrogen PEM systems sit near 60 %, 65 % is a target or a molten-carbonate-plus-turbine hybrid (a different system) — removed" }
  - { pathway: pathway:amtec, field: efficiency_record, disposition: model-only, action: removed, reason: "Cole 1983's abstract (read on OpenAlex): 'an AMTEC of mature design should have an efficiency of 20 to 40 percent' — a projection, not a measurement; a measured cell efficiency needs its own source", was: 0.2 }
  - { pathway: pathway:photosynthesis, field: efficiency_record, disposition: ambiguous-basis, action: removed, reason: "pass 39: Blankenship et al. 2011 read in full (open eScholarship copy) — short-term growing-season efficiencies 3.5 % (C3) and 4.3 % (C4), physiology-limited maxima 4.6 % and 6.0 %, none 4.5 %; removed; a measured record returns from Zhu, Long & Ort once read" }
