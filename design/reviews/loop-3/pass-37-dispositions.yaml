# Loop-3 pass 37: the power_density audit — one disposition per pathway for every legacy power_density field, with the
# pass-35 machinery (tools/audit-performance.mjs --pass 37 → pass-37-audit.md, gated in the tests). Dispositions (the
# second reader's pass-36 list): measured-and-projected-mixed · wrong-quantity · unsupported-generic ·
# ambiguous-normalisation · migrate-to-measurement · verified-same-architecture. `was` is the field at audit.
policy:
  power_density: "a legacy power_density stays only as a structured measurement — a measured value with a defined denominator and operating basis becomes a physical-scope datum, a source-defined projection with an explicit denominator and assumptions a model-scope datum, a projection without a reproducible basis is removed and kept in the audit note; a power in W with no normalisation is wrong-quantity and migrates to its actual quantity (electrical power), never called W/m²; after the sweep the field is no longer writable and any 'best recorded power density' is derived from structured physical measurements of matching units and bases (the pass-36 reply, findings 26–34)"
dispositions:
  - { pathway: pathway:passive-radiative-cooler, field: power_density, disposition: migrate-to-measurement, action: migrated, reason: "Raman et al. 2014's abstract (read on the Nature page): under direct sunlight exceeding 850 W/m² on a rooftop the photonic cooler cools to 4.9 °C below ambient and has a cooling power of 40.1 W/m² at ambient air temperature — a measured areal cooling power density with its basis; recorded as a device datum, the field deleted", was: 40.1 W/m² net cooling at ambient surface temperature under > 850 W/m² direct sunlight; 4.9 °C sub-ambient equilibrium temperature (Raman 2014) }
  - { pathway: pathway:reverse-electrowetting-harvester, field: power_density, disposition: measured-and-projected-mixed, action: split, reason: "Krupenkin & Taylor 2011 read on the open Nature Communications page: the measured level of generated power is ≈ 10² W/m² normalised to the liquid–substrate overlap area per droplet (28 mm² and 8 mm² configurations), recorded as a device datum; the abstract's 'up to 10³ W/m²' is the authors' stated potential of the method with no stated assumptions or denominator in the text read, so it is removed and kept here; the '≈ 1 mW per droplet-electrode' the atlas carried appears nowhere in the paper", was: ≈ 1 mW per droplet-electrode reported; ~1 kW/m² projected }
  - { pathway: pathway:capacitive-mixing-cell, field: power_density, disposition: ambiguous-normalisation, action: removed, reason: "Brogioli 2009's abstract (read on OpenAlex) reports a demonstration without a number; '≈ 0.01–0.1 W/m² of electrode in early cells' has no source page behind it — removed pending a read of the paper's results", was: ≈ 0.01–0.1 W/m² of electrode in early cells }
  - { pathway: pathway:evaporation-driven-engine, field: power_density, disposition: wrong-quantity, action: migrated, reason: "Chen et al. 2015 read in full (open PDF): the oscillatory engine coupled to a generator supplied energy in bursts at power levels reaching 60 mW with an average of 1.8 mW across a 100 kΩ resistor, water at 30 °C, the HYDRAs covering 9.6 cm × 7.6 cm of water surface — a power, never 'per kilogram of hygroscopic material'; recorded as two electrical-power data (peak, average), the field deleted", was: ≈ 60 mW per kilogram of hygroscopic material in a laboratory oscillator (Chen 2015) }
  - { pathway: pathway:flow-induced-vibration-harvester, field: power_density, disposition: unsupported-generic, action: removed, reason: "'µW–mW per device in wind tunnels and water channels' names no device, denominator or source page", was: µW–mW per device in wind tunnels and water channels }
  - { pathway: pathway:pneumatic-pressure-piezo-harvester, field: power_density, disposition: verified-same-architecture, action: removed, reason: "Yang et al. 2022's abstract gives 1.43 mW cm⁻³ at the maximum peak power (140 µW at 1500 kΩ, 0–0.5 MPa), and the pathway already carries it as a structured measurement — the legacy field is a duplicate", was: 1.43 mW cm⁻³ at the maximum peak power }
  - { pathway: pathway:thermoelectric-generator, field: power_density, disposition: unsupported-generic, action: removed, reason: "'≈ 1 W/cm² of module at ΔT = 200 K' names no module and no source page (books cited at pathway level)", was: ≈ 1 W/cm² of module at ΔT = 200 K }
  - { pathway: pathway:pyroelectric-harvester, field: power_density, disposition: unsupported-generic, action: removed, reason: "'µW–mW/cm² under thermal cycling at ~1 Hz' is a range with no device, basis or page", was: µW–mW/cm² under thermal cycling at ~1 Hz }
  - { pathway: pathway:thermogalvanic-cell, field: power_density, disposition: ambiguous-normalisation, action: removed, reason: "'≈ 1–10 W/m² of electrode' cites two reviews whose pages are unread; the electrode-area normalisation and the ΔT are unstated — removed pending a read", was: ≈ 1–10 W/m² of electrode }
  - { pathway: pathway:thermophotovoltaic, field: power_density, disposition: migrate-to-measurement, action: migrated, reason: "LaPotin et al. 2022's abstract: the 1.4/1.2 eV device reached (41.1 ± 1) % operating at a power density of 2.39 W cm⁻² and an emitter temperature of 2400 °C — recorded as a device datum, the field deleted", was: ≈ 2 W/cm² at a 2400 °C emitter }
  - { pathway: pathway:radiative-cooling-teg, field: power_density, disposition: measured-and-projected-mixed, action: split, reason: "'25 mW/m² measured; ≈ 0.5 W/m² projected' mixes two epistemic scopes; Raman, Li & Fan 2019 (Joule) has no abstract on Crossref or OpenAlex and the Cell Press page refuses the fetch, so neither number could be verified this pass — both removed from the canonical field and kept here; the measured 25 mW/m² returns as a device datum once the paper is read", was: 25 mW/m² measured; ≈ 0.5 W/m² projected }
  - { pathway: pathway:piezoelectric-vibration-harvester, field: power_density, disposition: unsupported-generic, action: removed, reason: "'10–100 µW/cm³ at ambient vibration levels' is a range with no device or page (Roundy 2003's abstract is not on record)", was: 10–100 µW/cm³ at ambient vibration levels }
  - { pathway: pathway:triboelectric-nanogenerator, field: power_density, disposition: unsupported-generic, action: removed, reason: "'up to ≈ 500 W/m² instantaneous' is not a figure of the cited Fan, Tian & Wang 2012 (the first flexible triboelectric generator) and cites no later source — removed", was: up to ≈ 500 W/m² instantaneous in contact–separation mode; average far lower }
  - { pathway: pathway:electrostatic-vibration-harvester, field: power_density, disposition: unsupported-generic, action: removed, reason: "'≈ 10–100 µW/cm³' is a range with no device or page", was: ≈ 10–100 µW/cm³ }
  - { pathway: pathway:electromagnetic-vibration-harvester, field: power_density, disposition: wrong-quantity, action: migrated, reason: "'≈ 50–500 µW/cm³ at 50–100 Hz' is a generic range; the cited Beeby et al. 2007's abstract (read on OpenAlex) reports a measured device — 46 µW into a 4 kΩ load at 0.59 m/s² and 52 Hz from a generator of 0.15 cm³ practical volume (0.1 cm³ component volume), 428 mV rms, 30 % of the environmental power delivered to the load — recorded as an electrical-power datum with the volume in its conditions (307 µW/cm³ on the practical volume is a derivation, in the note), the field deleted", was: ≈ 50–500 µW/cm³ at 50–100 Hz }
  - { pathway: pathway:magnetostrictive-harvester, field: power_density, disposition: unsupported-generic, action: removed, reason: "'≈ 0.2 mW/cm³ reported for Galfenol at 58 Hz' attributes to Wang & Yuan 2008, whose abstract (read on OpenAlex) describes a Metglas 2605SC harvester, not Galfenol; the number matches no read source — removed", was: ≈ 0.2 mW/cm³ reported for Galfenol at 58 Hz }
  - { pathway: pathway:magnetoelectric-field-harvester, field: power_density, disposition: unsupported-generic, action: removed, reason: "'mW-scale from 50/60 Hz stray fields of a few oersted' names no device, denominator or page (Nan 2008 review cited at pathway level)", was: mW-scale from 50/60 Hz stray fields of a few oersted }
  - { pathway: pathway:reverse-electrodialysis-plant, field: power_density, disposition: ambiguous-normalisation, action: removed, reason: "'≈ 1–2 W/m² of membrane' cites Post 2007 and Logan & Elimelech 2012 whose pages are unread (no abstract on record for Post 2007) — removed pending a read", was: ≈ 1–2 W/m² of membrane }
  - { pathway: pathway:pressure-retarded-osmosis-plant, field: power_density, disposition: ambiguous-normalisation, action: removed, reason: "'≈ 1–5 W/m² of membrane' is unread-page range and '5 W/m² is the usual economic threshold' is an economic statement, not a performance datum — removed pending a read of Logan & Elimelech 2012", was: ≈ 1–5 W/m² of membrane; 5 W/m² is the usual economic threshold }
  - { pathway: pathway:photovoltaic-module, field: power_density, disposition: unsupported-generic, action: removed, reason: "'≈ 200 W/m² at 1000 W/m² irradiance' is arithmetic on a typical efficiency, not a source figure; the structured module datum (24.7 % at 1000 W/m²) lets a reader derive 247 W/m²", was: ≈ 200 W/m² at 1000 W/m² irradiance }
  - { pathway: pathway:betavoltaic-battery, field: power_density, disposition: unsupported-generic, action: removed, reason: "'µW/cm² for tritium and Ni-63 sources; decades of life' is a range with no device or page", was: µW/cm² for tritium and Ni-63 sources; decades of life }
  - { pathway: pathway:radioisotope-thermoelectric-generator, field: power_density, disposition: ambiguous-normalisation, action: removed, reason: "'≈ 5 W(e) per kg for Pu-238 units' is a specific power whose generator family and page are unstated (Prelas 2014 review) — removed pending a read", was: ≈ 5 W(e) per kg for Pu-238 units }
  - { pathway: pathway:spin-seebeck-thermopile, field: power_density, disposition: unsupported-generic, action: removed, reason: "'nW–µW/cm² in laboratory films' is a range with no device or page", was: nW–µW/cm² in laboratory films; far below thermoelectrics }
  - { pathway: pathway:hydrovoltaic-generator, field: power_density, disposition: ambiguous-normalisation, action: removed, reason: "Xue et al. 2017's abstract (read on the Nature page) reports sustained voltages up to 1 V; '≈ 10–100 µW/cm² sustained by evaporation' is not in it and its area basis is unstated — removed pending a read of the paper's power figures", was: ≈ 10–100 µW/cm² sustained by evaporation }
  - { pathway: pathway:droplet-electricity-generator, field: power_density, disposition: migrate-to-measurement, action: migrated, reason: "Xu et al. 2020 (Nature) read on its page: when the load resistance is 332.0 kΩ the peak output power density is 50.1 W/m² (Extended Data Fig. 2c; load sweep 1 kΩ–100 MΩ, current 250 µA to 2 µA) — an instantaneous peak, recorded as a device datum with that basis, the field deleted", was: 50.1 W/m² instantaneous peak at a 332 kΩ load in the reported droplet-impact experiment }
