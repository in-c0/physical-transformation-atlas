# Loop-3 pass 45: the stage-versus-route measurement audit — every efficiency datum on a pathway, classified by the boundary of
# its numerator and denominator as read in its source, never by its scope label (the reviewer's pass-44 finding 10). Classes:
# route (the datum's boundaries are the route's: output at the route's sink over energy drawn from the route's source) ·
# stage (a component or stage inside the device — a wheel without its generator, a cycle before its generator, a semiconductor
# without its source) · population (a handbook or review range with no read page, a typical in a measurement's clothing) ·
# other-route (a figure that belongs to a different route than the pathway it sits on) · unresolved (the source does not say
# which boundary the figure uses). Actions: kept (basis clarified where it helps) · restaged (metric → device-stage-efficiency)
# · ranged (an aggregate range → value_range) · removed. tools/audit-stage-route.mjs joins this file to the compiled graph and
# gates that every efficiency datum has a row and that each row's action matches the data.
policy:
  stage_versus_route: "an efficiency is the route's conversion-efficiency only when its numerator is the route's output and its denominator is the energy drawn from the route's source; a stage figure is device-stage-efficiency with the stage and denominator in its basis; a handbook range is a population statement and is not a measurement; a figure for another route is moved or removed; a figure whose boundary the source does not state stays with the ambiguity written into its basis"
dispositions:
  - { pathway: pathway:combustion-microthermophotovoltaic-generator, quantity: heat-to-electricity efficiency, source: source:chan-2013-microthermophotovoltaic, numerator: "344 mW electric output of the μTPV generator (after the maximum-power-point tracking converter)", denominator: "13.7 W input thermal power to the propane microcombustor (the abstract's words; the fuel's heat release, on the route's chemical boundary)", class: route, action: kept, reason: "the abstract frames the figure as heat-to-electricity with the microcombustor's input thermal power as denominator — the propane's heat release, which is the route's chemical input under complete combustion; the basis now says so" }
  - { pathway: pathway:radioluminescent-nuclear-battery, quantity: total power conversion efficiency, source: source:russo-2017-radioluminescent-nuclear-battery, numerator: "electrical output of the InGaP cell", denominator: "the β⁻ source power (15 mCi ⁶³Ni, volumetric configuration)", class: route, action: kept, reason: "the source power is the route's input (decay → radioluminescence → photovoltaic → electricity)" }
  - { pathway: pathway:thermocapillary-piezoelectric-micro-heat-engine, quantity: predicted system efficiency, source: source:odukoya-naterer-2013-thermocapillary-mhe, numerator: "predicted electrical output of the model", denominator: "heat input of the model", class: route, action: kept, reason: "a model datum (simulated) on the route's boundaries; never decides" }
