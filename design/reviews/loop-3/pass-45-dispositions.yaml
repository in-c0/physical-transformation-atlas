  - { pathway: pathway:thermoelectric-generator, quantity: module conversion efficiency, value: "12.0%", source: source:zhang-2017-segmented-teg, numerator: "module electrical output at matched load", denominator: "heat flow through the module (measured at the cold side: Q_h = P + Q_c)", class: route, action: kept, reason: "the module's heat input is the route's thermal input; the cold-side measurement gives Q_h by energy balance" }
